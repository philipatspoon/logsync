function cardEditor(c){
  const k=c.kind;
  const t=(f,ph,cls='')=>`<textarea data-f="${f}" class="${cls}" placeholder="${ph}">${esc(c[f])}</textarea>`;
  const opt=[];
  const o=(f,ph,label)=>{if(c[f]) return t(f,ph);opt.push(`<button class="ghost" data-a="show-field" data-field="${f}" data-ph="${esc(ph)}">＋ ${label}</button>`);return '';};
  let h=`<div class="ed-card k-${k}" data-card="${c.id}">
    <div class="ed-card-top">
      ${hm(k)}<select data-f="kind">${Object.entries(KINDS).map(([v,l])=>`<option value="${v}" ${v===k?'selected':''}>${l}</option>`).join('')}</select>
      ${k==='core'||k==='guest'?`<label title="Återkommande fråga"><input type="checkbox" data-f="recurring" ${c.recurring?'checked':''}> ↻ återkommande</label>`:''}
      <select data-f="scale" title="Textstorlek på värdskärmen" style="margin-left:auto">${[0.5,0.6,0.7,0.8,0.9,1,1.1,1.2,1.3,1.4,1.5].map(x=>`<option value="${x}" ${Math.abs((c.scale||1)-x)<.01?'selected':''}>Storlek ${Math.round(x*100)}%</option>`).join('')}</select>
      ${live.cardId===c.id?'<span class="badge" style="background:var(--acc)">LIVE</span>':''}
      <button class="ghost" data-a="card-up" data-id="${c.id}" title="Flytta upp">↑</button>
      <button class="ghost" data-a="card-down" data-id="${c.id}" title="Flytta ner">↓</button>
      <button class="ghost" data-a="card-dup" data-id="${c.id}" title="Duplicera">⧉</button>
      <button class="ghost danger" data-a="card-del" data-id="${c.id}" title="Ta bort">✕</button>
    </div>`;
  if(k==='moment'){
    h+=t('text','Momentets titel, t.ex. Blind rank','ed-main-text')+o('rules','Regler/instruktion som värden ser först','Regler')
      +`<input data-f="listLabel" value="${esc(c.listLabel)}" placeholder="Listans rubrik, t.ex. Payment methods">`
      +`<textarea data-f="listText" placeholder="Alternativ – ett per rad. Visas ett i taget.">${esc((c.list||[]).join('\n'))}</textarea>`;
  }else if(k==='script'){
    h+=t('text','Manus. En rad per replik: "Namn: replik". Rader utan namn visas som scenanvisning.');
  }else{
    h+=t('text',k==='info'?'Text som visas för värden':'Fråga','ed-main-text')+o('followUp','Följdfråga – visas med F / →','Följdfråga');
  }
  h+=o('background','Bakgrund/anteckning – syns bara för dig (kan visas för värden med I)','Bakgrund');
  if(opt.length) h+=`<div class="ed-opt">${opt.join('')}</div>`;
  return h+'</div>';
}
function onEditorInput(e){
  const el=e.target,ep=activeEp();if(!ep) return;
  if(el.dataset.ef){ep[el.dataset.ef]=el.value;renderHeader();saveData();broadcastSoon();return;}
  if(el.dataset.sf){const s=ep.sections.find(x=>x.id===el.closest('[data-sec]').dataset.sec);if(s) s.title=el.value;saveData();broadcastSoon();return;}
  const ce=el.closest('[data-card]');if(!ce||!el.dataset.f||el.dataset.f==='kind') return;
  const f=findCard(ce.dataset.card);if(!f) return;
  const fld=el.dataset.f;
  if(fld==='listText') f.card.list=el.value.split('\n').map(s=>s.trim()).filter(Boolean);
  else if(fld==='recurring') f.card.recurring=el.checked;
  else if(fld==='scale') f.card.scale=+el.value;
  else f.card[fld]=el.value;
  saveData();broadcastSoon();
}
function onEditorChange(e){
  const el=e.target;
  if(el.dataset.f==='kind'){const f=findCard(el.closest('[data-card]').dataset.card);if(!f) return;snapshot();f.card.kind=el.value;afterStructural();}
  if(el.dataset.f==='recurring') onEditorInput(e);
}
function afterStructural(msg){saveData(true);ensurePos();renderEditor();renderHeader();broadcast();if(msg) toast(msg,5000,true);}
function moveIn(arr,i,d){const j=i+d;if(j<0||j>=arr.length) return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true;}

function editorAction(a,el){
  const ep=activeEp(),id=el.dataset.id;
  switch(a){
    case 'ep-pick':switchEpisode(id);break;
    case 'ep-new':{stopRec();snapshot();const e=emptyEpisode();data.episodes.push(e);switchEpisode(e.id);break;}
    case 'ep-dup':case 'ep-core':{
      if(!ep) return;snapshot();const e=clone(ep);e.id=uid();
      e.title=e.title+(a==='ep-core'?' (ny)':' (kopia)');
      if(a==='ep-core'){e.guest='';e.guestTitle='';e.sections.forEach(s=>s.cards=s.cards.filter(c=>c.kind==='core'));}
      e.sections.forEach(s=>{s.id=uid();s.cards.forEach(c=>c.id=uid());});
      stopRec();data.episodes.push(e);switchEpisode(e.id);break;}
    case 'ep-del':{
      if(!ep||!confirm(`Ta bort episoden "${ep.guest||ep.title}"?`)) return;stopRec();snapshot();
      data.episodes=data.episodes.filter(x=>x!==ep);if(!data.episodes.length) data.episodes.push(emptyEpisode());
      data.activeEpisodeId=data.episodes[0].id;afterStructural('Episod borttagen');renderAll();break;}
    case 'sec-add':snapshot();ep.sections.push({id:uid(),title:'BLOCK '+(ep.sections.length+1),cards:[]});afterStructural();break;
    case 'sec-up':case 'sec-down':{const i=ep.sections.findIndex(s=>s.id===id);snapshot();moveIn(ep.sections,i,a==='sec-up'?-1:1);afterStructural();break;}
    case 'sec-del':{const s=ep.sections.find(x=>x.id===id);if(s.cards.length&&!confirm(`Ta bort "${s.title}" och ${s.cards.length} kort?`)) return;snapshot();ep.sections=ep.sections.filter(x=>x!==s);afterStructural('Sektion borttagen');break;}
    case 'card-add':{const s=ep.sections.find(x=>x.id===id);snapshot();const c=newCard(el.dataset.kind,'');s.cards.push(c);afterStructural();
      const ta=$(`[data-card="${c.id}"] textarea`);if(ta){ta.focus();ta.scrollIntoView({block:'center'});}break;}
    case 'card-del':{const f=findCard(id);if(!f) break;snapshot();
      if(id===live.cardId){const n=neighbour(1)||neighbour(-1);live.cardId=n?n.id:null;live.reveal=0;}
      f.sec.cards=f.sec.cards.filter(c=>c.id!==id);afterStructural('Kort borttaget');saveLive();break;}
    case 'card-dup':{const f=findCard(id);snapshot();const c=clone(f.card);c.id=uid();f.sec.cards.splice(f.sec.cards.indexOf(f.card)+1,0,c);afterStructural();break;}
    case 'card-up':case 'card-down':{
      const f=findCard(id),d=a==='card-up'?-1:1,cards=f.sec.cards,i=cards.indexOf(f.card);snapshot();
      if(!moveIn(cards,i,d)){ // flytta över sektionsgräns
        const si=ep.sections.indexOf(f.sec),ts=ep.sections[si+d];
        if(ts){cards.splice(i,1);d<0?ts.cards.push(f.card):ts.cards.unshift(f.card);}
      }
      afterStructural();break;}
    case 'show-field':{const ta=document.createElement('textarea');ta.dataset.f=el.dataset.field;ta.placeholder=el.dataset.ph;
      const card=el.closest('.ed-card');card.insertBefore(ta,el.parentElement);el.remove();ta.focus();break;}
    case 'import':openImport();break;
    case 'export':exportJson();break;
    case 'import-json':importJson();break;
    case 'reset-all':if(confirm('Ersätta ALLA episoder med exempeldata? Loggarna ligger kvar tills du rensar dem. (Exportera backup först om du vill spara.)')){stopRec();snapshot();data=seedData();live=clone(DEFAULT_LIVE);ensurePos();afterStructural('Återställt');renderAll();}break;
    case 'imp-new':case 'imp-replace':doImport(a==='imp-replace');break;
    case 'font-add':{const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.accept='.woff2,.woff,.ttf,.otf';
      inp.onchange=async()=>{await addFontFiles([...inp.files]);const fs=$('#fontStatus');if(fs) fs.innerHTML=fontStatus();};inp.click();break;}
    case 'font-clear':write(LS_FONTS,{faces:[]});applyFonts();try{CH&&CH.postMessage({type:'vh:fonts'});}catch(e){}{const fs=$('#fontStatus');if(fs) fs.innerHTML=fontStatus();}break;
    case 'settings-copy':navigator.clipboard?.writeText(displayUrl()).then(()=>toast('Länk kopierad'));break;
    case 'settings-reset':if(!confirm('Återställa visningsinställningarna till standard? Synk, parning och typsnitt behålls.')) break;
      settings={...clone(DEFAULT_SETTINGS),...keepMachine(settings)};saveSettings();closeModal();renderLive();broadcast();break;
  }
}

/* ---- import / export ---- */
let impLines=null;
function openImport(){
  showModal(`<div class="modal-card">
    <h3>Importera manus från Google Docs</h3>
    <p>Öppna manusfliken i Google Docs → markera allt (⌘A / Ctrl+A) → kopiera → klistra in nedan. Rubriker blir sektioner, "Core/Guest questions" sätter frågetyp, punktlistor blir kort, <b>Follow-up:</b> blir följdfråga och <b>Background:</b> blir din anteckning. ↻ markeras som återkommande. Moment- och outro-rubriker tolkas som moment respektive manus.</p>
    <textarea id="impText" placeholder="Klistra in här…"></textarea>
    <div class="imp-sum" id="impSum"><span class="muted">Ingen text ännu.</span></div>
    <div class="row"><button class="primary" data-a="imp-new">Skapa ny episod</button><button data-a="imp-replace">Ersätt aktiv episod</button><span class="grow"></span><button data-a="modal-close">Avbryt</button></div>
  </div>`);
  impLines=null;
  const ta=$('#impText');
  ta.addEventListener('paste',e=>{
    const html=e.clipboardData.getData('text/html'),txt=e.clipboardData.getData('text/plain');
    if(html){e.preventDefault();impLines=htmlToLines(html);ta.value=txt||impLines.map(l=>l.text).join('\n');impPreview();}
  });
  ta.addEventListener('input',()=>{impLines=null;impPreview();});
  ta.focus();
}
function impParse(){const txt=$('#impText').value;if(!impLines&&!txt.trim()) return null;return parseScript(impLines||textToLines(txt));}
function impPreview(){
  const ep=impParse(),el=$('#impSum');
  if(!ep){el.innerHTML='<span class="muted">Ingen text ännu.</span>';return;}
  const n=allCards(ep).length;
  el.innerHTML=`<b>${esc(ep.title||'(ingen titel)')}</b> · ${esc(ep.guest||'(ingen gäst)')} ${ep.guestTitle?'· '+esc(ep.guestTitle):''}<br>${ep.sections.length} sektioner, ${n} kort ${impLines?'(formatering från Docs)':'(ren text)'}<ul>`+
    ep.sections.map(s=>`<li><b>${esc(s.title)}</b>: ${Object.keys(KINDS).map(k=>{const c=s.cards.filter(x=>x.kind===k).length;return c?`${c} ${KINDS[k].toLowerCase()}`:'';}).filter(Boolean).join(', ')||'tom'}</li>`).join('')+'</ul>';
}
function doImport(replace){
  const ep=impParse();if(!ep||!allCards(ep).length){toast('Hittade inga frågor att importera.');return;}
  stopRec();snapshot();
  if(replace){const cur=activeEp();ep.id=cur.id;data.episodes[data.episodes.indexOf(cur)]=ep;}
  else data.episodes.push(ep);
  data.activeEpisodeId=ep.id;live.cardId=null;closeModal();afterStructural(`Importerade ${allCards(ep).length} kort`);renderAll();saveLive();
}
function exportJson(){
  const blob=new Blob([JSON.stringify({app:'vardskarm',version:3,exported:new Date().toISOString(),data,settings,logs,fonts:getFonts(),brand:getBrand()},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`logsync-backup-${new Date().toLocaleDateString('sv-SE')}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importJson(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async()=>{try{const j=JSON.parse(await inp.files[0].text());const d=j.data||j;
    if(!Array.isArray(d.episodes)) throw new Error('fel format');
    if(!confirm('Ersätta all nuvarande data med backupen?')) return;
    stopRec();snapshot();data=d;if(j.settings) settings={...DEFAULT_SETTINGS,...j.settings,...keepMachine(settings)};saveSettings();if(j.logs&&typeof j.logs==='object'){logs=j.logs;saveLog();}
    if(j.fonts&&Array.isArray(j.fonts.faces)){write(LS_FONTS,j.fonts);applyFonts();}
    if(j.brand) saveBrand(j.brand);
    if(!activeEp()) data.activeEpisodeId=data.episodes[0].id;afterStructural('Backup inläst');renderAll();
  }catch(e){toast('Kunde inte läsa filen: '+e.message);}};
  inp.click();
}

/* ---- branding i inställningarna ---- */
let brandDraft=null;
function renderBrandNow(){
  const el=$('#brandNow');if(!el) return;
  el.innerHTML=BRAND?`${logoHTML(BRAND.logo,'tile',BRAND.mono!==false)}<b>${esc(BRAND.name||'Egen branding')}</b>${BRAND.logo?`<label class="cb" style="font-size:13px"><input type="checkbox" id="brandMono" ${BRAND.mono!==false?'checked':''}> Visa logotypen i vitt</label>`:''}`:'<span class="muted">Ingen branding inlagd</span>';
  const m=$('#brandMono');if(m) m.onchange=()=>{saveBrand({...BRAND,mono:m.checked});renderBrandNow();};
  const fs=$('#fontStatus');if(fs) fs.innerHTML=fontStatus();
  const ac=$('[data-s=accent]');if(ac) ac.innerHTML=accentOptions().map(([v,l])=>`<option value="${v}" ${settings.accent===v?'selected':''}>${esc(l)}</option>`).join('');
}
async function brandFetch(){
  const url=$('#brandUrl').value.trim(),res=$('#brandRes');if(!res) return;
  if(!url){toast('Skriv en webbadress först');return;}
  res.innerHTML='<div class="muted">Hämtar branding …</div>';brandDraft=null;
  let j;
  try{j=await tt('/brand',{url,fonts:true});}
  catch(e){
    if(!document.contains(res)) return;
    res.innerHTML=e.offline?`<div class="brand-off"><span class="warn-t">Logsync-appen är inte igång.</span> Den behövs för att läsa andra webbplatser. <button data-a="brand-start">▶ Starta Logsync-appen</button> <a href="${helperZip()}" style="color:inherit">Hämta appen</a><div id="brandMsg" class="hint">Utan appen kan du välja en logotypfil här ovanför och läsa in typsnitt längre ned.</div></div>`
      :`<div class="warn-t">${esc(e.message)}</div>`;return;}
  if(!document.contains(res)) return;
  brandDraft={url:j.url,name:j.name||'',logos:(j.logos||[]).map(cleanLogo).filter(Boolean),colors:(j.colors||[]).map(c=>c.hex).filter(c=>/^#[0-9a-f]{6}$/i.test(c)),font:j.font&&j.font.faces&&j.font.faces.some(f=>f.data)?j.font:null,pick:0,accent:null,useFont:true};
  renderBrandDraft();
}
function renderBrandDraft(){
  const d=brandDraft,res=$('#brandRes');if(!d||!res) return;
  res.innerHTML=`<div class="brand-draft">
    <label>Namn<input id="bdName" value="${esc(d.name)}"></label>
    <div><span class="muted">Logotyp</span><div class="bd-logos">${d.logos.map((l,i)=>`<button class="bd-logo${i===d.pick?' on':''}" data-a="bd-logo" data-i="${i}" title="${esc(l.label||'')}">${logoHTML(l,'tile',true)}</button>`).join('')||'<span class="muted">Hittade ingen logotyp. Välj en fil i stället.</span>'}${d.logos.length?`<button class="bd-logo${d.pick<0?' on':''}" data-a="bd-logo" data-i="-1">Ingen</button>`:''}</div></div>
    <div><span class="muted">Färg på meddelanden till programledaren</span><div class="bd-colors"><button class="bd-col${!d.accent?' on':''}" data-a="bd-col" data-c="" style="background:#faf7f2" title="Vit (standard)"></button>${d.colors.map(c=>`<button class="bd-col${d.accent===c?' on':''}" data-a="bd-col" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div></div>
    ${d.font?`<label class="cb"><input type="checkbox" id="bdFont" ${d.useFont?'checked':''}> Använd sidans typsnitt: <b>${esc(d.font.family)}</b> (${d.font.faces.map(f=>esc(f.weight)).join(', ')})</label><span class="hint">Typsnitt har ofta licensvillkor. Använd det bara om ni har rätt till det.</span>`:'<span class="muted">Hittade inget typsnitt att hämta.</span>'}
    <div class="row"><button class="primary" data-a="bd-apply">Använd</button><button data-a="bd-cancel">Avbryt</button></div></div>`;
  $('#bdName').oninput=e=>{d.name=e.target.value;};const bf=$('#bdFont');if(bf) bf.onchange=()=>{d.useFont=bf.checked;};
}
function brandApply(){
  const d=brandDraft;if(!d) return;
  if(!saveBrand({url:d.url,name:d.name.trim(),logo:d.pick>=0?d.logos[d.pick]:null,mono:true,colors:d.colors})) return;
  if(d.font&&d.useFont){
    const faces=d.font.faces.filter(f=>f.data).map(f=>({weight:f.weight,name:f.name,data:f.data}));
    if(write(LS_FONTS,{family:d.font.family,faces})){applyFonts();try{CH&&CH.postMessage({type:'vh:fonts'});}catch(e){}}
    else toast('Typsnittet fick inte plats i webbläsarens lagring.');
  }
  settings.accent=d.accent||DEFAULT_SETTINGS.accent;saveSettings();
  brandDraft=null;$('#brandRes').innerHTML='';renderBrandNow();renderLive();broadcast();toast('Brandingen är inlagd');
}
function brandFile(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.svg,.png,.jpg,.jpeg,.webp,image/svg+xml,image/png,image/jpeg,image/webp';
  inp.onchange=async()=>{const f=inp.files[0];if(!f) return;let logo=null;
    if(/svg/i.test(f.type)||/\.svg$/i.test(f.name)) logo=cleanSvg(await f.text());
    else if(f.size<=600000){const src=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});
      const ratio=await new Promise(r=>{const im=new Image();im.onload=()=>r(im.naturalHeight?+(im.naturalWidth/im.naturalHeight).toFixed(2):1);im.onerror=()=>r(1);im.src=src;});logo=cleanLogo({kind:'img',src,ratio});}
    if(!logo){toast('Kunde inte läsa logotypen. Använd SVG eller PNG (högst 600 kB).');return;}
    if(saveBrand({...(BRAND||{}),logo,name:(BRAND&&BRAND.name)||f.name.replace(/\.[^.]+$/,'')})){renderBrandNow();renderLive();broadcast();}};
  inp.click();
}
function brandAction(a,el){
  switch(a){
    case 'brand-fetch':brandFetch();return true;
    case 'brand-file':brandFile();return true;
    case 'brand-clear':if(BRAND&&confirm('Ta bort brandingen? Typsnittet tas bort separat längre ned.')){saveBrand(null);brandDraft=null;const r=$('#brandRes');if(r) r.innerHTML='';renderBrandNow();renderLive();broadcast();}return true;
    case 'brand-start':startHelper($('#brandMsg')).then(ok=>{if(ok) brandFetch();});return true;
    case 'bd-logo':if(brandDraft){brandDraft.pick=+el.dataset.i;renderBrandDraft();}return true;
    case 'bd-col':if(brandDraft){brandDraft.accent=el.dataset.c||null;renderBrandDraft();}return true;
    case 'bd-apply':brandApply();return true;
    case 'bd-cancel':brandDraft=null;$('#brandRes').innerHTML='';return true;
  }
  return false;
}

/* ---- settings ---- */
function showModal(html){const m=$('#modal');m.innerHTML=html;m.hidden=false;m.onclick=e=>{if(e.target===m) closeModal();};}
function closeModal(){syncCtx=null;if(ocrRun){ocrRun.stop=true;ocrRun=null;}if(live.calib){live.calib=false;commit();}stopCam();snap=null;$('#modal').hidden=true;$('#modal').innerHTML='';}
function openSettings(){
  const S=settings;
  showModal(`<div class="modal-card"><h3>Inställningar</h3>
    <div class="set-brand">
      <div class="row"><span class="muted" style="font-size:13px">Branding</span><span id="brandNow" class="brand-now"></span></div>
      <div class="row"><input id="brandUrl" placeholder="Webbadress, t.ex. exempel.se" value="${esc((BRAND&&BRAND.url)||'')}" style="flex:1;min-width:200px" autocomplete="off"><button data-a="brand-fetch">Hämta från webbplats</button><button data-a="brand-file">Välj logotypfil …</button><button data-a="brand-clear" class="ghost">Ta bort</button></div>
      <div id="brandRes"></div>
      <span class="hint">Hämtar logotyp, färger och typsnitt från en webbplats. Det sparas bara i den här webbläsaren och följer med i backupen.</span>
    </div>
    <div class="set-grid">
      <label>Textstorlek, alla kort: <b id="fsVal" style="color:var(--text)">${Math.round(S.fontScale*100)}%</b><input type="range" min="0.5" max="1.3" step="0.05" data-s="fontScale" value="${S.fontScale}"></label>
      <label>Färg på meddelanden <select data-s="accent">${accentOptions().map(([v,l])=>`<option value="${v}" ${S.accent===v?'selected':''}>${esc(l)}</option>`).join('')}</select></label>
      <label>Språk för etiketter på värdskärmen <select data-s="hostLang"><option value="sv" ${S.hostLang==='sv'?'selected':''}>Svenska</option><option value="en" ${S.hostLang==='en'?'selected':''}>English</option></select></label>
      <label>Programledarens namn (repliker i manus markeras) <input data-s="hostName" value="${esc(S.hostName)}" placeholder="t.ex. förnamnet i manuset"></label>
      <label class="cb"><input type="checkbox" data-s="showNext" ${S.showNext?'checked':''}> Visa "Nästa" längst ner</label>
      <label class="cb"><input type="checkbox" data-s="showProgress" ${S.showProgress?'checked':''}> Visa position (3 / 6)</label>
      <label>Tidskod överst på värdskärmen <select data-s="tcMode"><option value="camera" ${S.tcMode==='camera'?'selected':''}>Kamerans tidskod (synkad)</option><option value="timer" ${S.tcMode==='timer'?'selected':''}>Inspelningstid (styrs med T)</option><option value="clock" ${S.tcMode==='clock'?'selected':''}>Klockslag</option><option value="off" ${S.tcMode==='off'?'selected':''}>Av</option></select></label>
      <label class="cb"><input type="checkbox" data-s="previewFollowUp" ${S.previewFollowUp?'checked':''}> Visa följdfrågan litet under frågan direkt</label>
      <label class="cb"><input type="checkbox" data-s="syncOnRec" ${S.syncOnRec?'checked':''}> Öppna tidskodssynk vid varje REC</label>
      <label class="cb"><input type="checkbox" data-s="animations" ${S.animations?'checked':''}> Animerade övergångar</label>
      <label class="cb"><input type="checkbox" data-s="showMark" ${S.showMark?'checked':''}> Visa logotypen i hörnet</label>
      <label class="cb"><input type="checkbox" data-s="mirror" ${S.mirror?'checked':''}> Spegelvänd värdskärm (prompterglas)</label>
      <label>Meddelanden försvinner efter (sek, 0 = tills Rensa) <input type="number" min="0" max="120" data-s="cueSeconds" value="${S.cueSeconds}"></label>
      <label class="full">Snabbmeddelanden – ett per rad (max 9, tangent 1–9)<textarea data-s="cues">${esc(S.cues.join('\n'))}</textarea></label>
      <label class="full">Loggknappar – en per rad (max 9, Shift + 1–9)<textarea data-s="logTags">${esc(S.logTags.join('\n'))}</textarea></label>
      <div class="full set-font"><span class="muted">Typsnitt på värdskärmen</span><div class="row"><button data-a="font-add">Välj typsnittsfiler …</button><button data-a="font-clear" class="ghost">Ta bort</button><span id="fontStatus" class="hint" style="flex:1">${fontStatus()}</span></div>
        <span class="hint">Välj alla vikter på en gång (.woff2, .ttf eller .otf). Filerna sparas bara i den här webbläsaren och följer med i backupen.</span></div>
      <label class="full">Länk till värdskärmen (om du vill öppna den manuellt i annan flik)<div class="row"><input readonly value="${esc(displayUrl())}" style="flex:1"><button data-a="settings-copy">Kopiera</button></div></label>
    </div>
    <div class="row"><button data-a="settings-reset" class="danger">Återställ standard</button><span class="grow"></span><button class="primary" data-a="modal-close">Klar</button></div></div>`);
  $('#modal .modal-card').addEventListener('input',e=>{
    const el=e.target,k=el.dataset.s;if(!k) return;
    let v=el.type==='checkbox'?el.checked:el.value;
    if(k==='fontScale'||k==='cueSeconds') v=+v;
    if(k==='cues'||k==='logTags') v=el.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,9);
    settings[k]=v;saveSettings();ensurePos();renderLive();broadcast();
    if(k==='fontScale'&&$('#fsVal')) $('#fsVal').textContent=Math.round(v*100)+'%';
  });
  $('#brandUrl').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();brandFetch();}});
  renderBrandNow();
}

/* ---- boot ---- */
// Publicerad på https: en service worker sparar appen så att den startar utan nät. Lokalt (file://) behövs den inte.
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
loadBrand();applyFonts();
if(document.fonts) document.fonts.addEventListener('loadingdone',()=>refitStages());
if(MODE==='display') initDisplay();
else if(MODE==='phone') initPhone();
else{load();initOperator();}
</script>
</body>
</html>
