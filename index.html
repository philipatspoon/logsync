<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logsync</title>
<style>
:root{
  /* Grundpalett */
  --black:#0c0c0b;--cream:#faf7f2;--g200:#e6deda;--g400:#bdb0aa;--g600:#706864;--g800:#272727;
  --blue200:#a8ceff;--blue300:#66a8ff;--blue500:#094fff;--green300:#d7fa6f;--orange300:#ff9c55;--orange500:#ff6430;--purple300:#e782f7;
  --core:var(--blue200);--guest:var(--blue500);--moment:var(--orange300);--script:var(--purple300);--info:var(--g400);
  --font:"VH Custom",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --track-title:-0.03em;--track-sub:-0.02em;--track-tight:-0.01em;
}
:root,[data-theme=dark]{
  --bg:var(--black);--panel:#181817;--panel2:var(--g800);--panel3:#343331;--field:#121211;--line:#2f2e2c;--text:var(--cream);--muted:#9c938e;
  --acc:var(--cream);--acc-fg:var(--black);--sel:#232322;--danger:var(--orange500);--ok:var(--green300);
}
[data-theme=light]{
  --bg:var(--cream);--panel:#f2ede6;--panel2:var(--g200);--panel3:#d8cfca;--field:#fff;--line:#ddd4ce;--text:var(--black);--muted:var(--g600);
  --acc:var(--blue500);--acc-fg:#fff;--sel:#e2eaff;--danger:#d23f0e;--ok:#3f7d10;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 var(--font);letter-spacing:var(--track-tight);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
/* hörn */
button,.rd-card,.ed-card,#toast{border-radius:6px}
.panel,.next-box,.ed-sec,.modal-card{border-radius:12px}
button{font:inherit;font-weight:500;color:inherit;background:var(--panel2);border:0;padding:8px 13px;cursor:pointer;white-space:nowrap;letter-spacing:var(--track-tight)}
button:hover{background:var(--panel3)}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--acc);color:var(--acc-fg);padding-inline:26px}
button.primary:hover{filter:brightness(1.08)}
button.on{background:var(--sel);color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
button.danger{color:var(--danger)}
button.ghost{background:transparent;padding:4px 8px}
button.ghost:hover{background:var(--panel2)}
kbd{font:500 11px/1 var(--font);padding:2px 5px;border:1px solid currentColor;border-radius:3px;opacity:.5;margin-left:7px}
input,textarea,select{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%;letter-spacing:var(--track-tight)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
textarea{resize:vertical;field-sizing:content;min-height:40px}
label{color:var(--muted);font-size:13px}
h4{margin:0 0 10px;font-size:14px;font-weight:500;letter-spacing:var(--track-sub);color:var(--muted)}
.hm{display:inline-block;height:.72em;width:auto;flex:none}

/* ---------- Operator ---------- */
.op{display:grid;grid-template-rows:60px 1fr 32px;height:100vh}
.op-hdr{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px;white-space:nowrap}
.brand .blogo{height:17px;max-width:130px}
.brand b{font-weight:500;letter-spacing:var(--track-sub)}
.op-hdr select{width:auto;max-width:300px;padding:7px 9px}
.tabs{display:flex;gap:2px;background:var(--panel);padding:3px;border-radius:9px}
.tabs button{background:transparent;padding:6px 16px;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--text);box-shadow:none}
.grow{flex:1}
.timer{display:flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.timer span{font-size:18px;font-weight:500;min-width:80px;text-align:right;margin-right:6px;letter-spacing:var(--track-sub)}
.timer.run span{color:var(--danger)}
.conn i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--g600);margin-right:9px;vertical-align:0}
.conn.ok i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.op-ftr{display:flex;align-items:center;gap:18px;padding:0 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;background:var(--bg);overflow:hidden;white-space:nowrap}
.op-ftr b{color:var(--text);font-weight:500}
.save-ind{margin-left:auto;color:var(--muted)}

.op-live{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;min-height:0}
.rundown{overflow:auto;border-right:1px solid var(--line);padding:12px 10px 40px}
.rd-head{padding:6px 8px 12px}
.rd-title{font-weight:500;font-size:17px;letter-spacing:var(--track-sub)}
.rd-guest{color:var(--muted);font-size:13px}
.rd-sec{font-size:13px;font-weight:500;color:var(--muted);padding:16px 8px 6px;letter-spacing:var(--track-sub)}
.rd-card{display:flex;align-items:flex-start;gap:10px;padding:8px 9px;cursor:pointer;--c:6px}
.rd-card:hover{background:var(--panel)}
.rd-card.cur{background:var(--sel);box-shadow:inset 0 0 0 1.5px var(--acc)}
.rd-card.done:not(.cur) .rd-t{color:var(--muted)}
.rd-card.done:not(.cur) .rd-k::after{content:"✓";position:absolute;right:-7px;top:-7px;font-size:11px;color:var(--ok)}
.rd-card.skip .rd-t{text-decoration:line-through;opacity:.4}
.rd-k{position:relative;flex:none;width:24px;display:flex;justify-content:center;padding-top:3px}
.rd-k .hm{height:14px}
.rd-t{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px}
.rd-f{flex:none;color:var(--muted);font-size:12px}
.rd-skip{flex:none;padding:0 6px;font-size:13px;opacity:0;background:transparent}
.rd-card:hover .rd-skip,.rd-card.skip .rd-skip{opacity:.8}
.rd-foot{padding:18px 8px}
.rd-foot button{font-size:13px;width:100%}

.center{padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0;overflow:auto}
.pv-wrap{position:relative;width:min(100%,calc((100vh - 610px)*16/9));min-width:min(100%,360px);aspect-ratio:16/9;margin:0 auto;background:var(--black);flex:none;border-radius:10px;overflow:hidden}
.pv-badges{position:absolute;top:14px;right:30px;display:flex;gap:6px}
.pv-badges span{font-size:12px;font-weight:500;background:var(--orange500);color:var(--black);padding:3px 9px}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctrl button{padding:9px 13px}
.ctrl button.big{padding:11px 34px}
.sz{display:inline-flex;gap:2px;align-items:center;margin-left:6px}
.sz button{padding:11px 11px}
.sz #szVal{min-width:58px;padding:11px 6px;font-variant-numeric:tabular-nums}
.sz #szVal.on{color:var(--text);box-shadow:none;background:var(--sel)}
.next-box{max-width:900px;width:100%;margin:0 auto;background:var(--panel);padding:14px 16px}
/* logger */
.logger{display:flex;flex-direction:column;gap:9px;flex:1 0 auto;min-height:400px;max-width:1100px;width:100%;margin:0 auto;transition:box-shadow .3s}
.logger.recording{box-shadow:inset 0 0 0 2px var(--orange500)}
.lg-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logger button.rec{background:var(--panel2);color:var(--orange500);font-size:16px;padding:11px 20px}
.logger button.rec.on{background:var(--orange500);color:var(--black);box-shadow:none;animation:recPulse 2s ease-in-out infinite}
@keyframes recPulse{50%{filter:brightness(.8)}}
.lg-tc{font-size:30px;font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums;line-height:1}
.lg-tc{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:500;font-size:27px}
.lg-meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.warn-t{color:var(--orange300)}.ok-t{color:var(--green300)}.rec-t{color:var(--orange500)}
button.warn{box-shadow:inset 0 0 0 1.5px var(--orange300);color:var(--orange300)}
.lg-tags{display:flex;flex-wrap:wrap;gap:6px}
.lg-tags button{font-size:13px;padding:6px 10px}
.lg-top>button:not(.rec){font-size:13.5px;padding:8px 12px}
.lg-note{display:flex;gap:6px;align-items:center}
.lg-notetc{font:500 12px ui-monospace,Menlo,monospace;color:var(--orange300);white-space:nowrap}
.lg-notetc:empty{display:none}
.lg-list{flex:1;min-height:120px;overflow:auto;border-top:1px solid var(--line);margin:0 -14px -14px;padding:4px 0}
.lg-row{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:baseline;padding:6px 14px;font-size:13.5px;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.lg-row.flash{animation:rowFlash 1s ease}
@keyframes rowFlash{from{background:color-mix(in srgb,var(--green300) 25%,transparent)}}
.lg-rtc{font:500 12.5px ui-monospace,Menlo,monospace;color:var(--muted)}
.lg-clip{font-size:11.5px;color:var(--orange500);min-width:22px}
.norec .lg-clip{color:var(--g600)}
.lg-body{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;min-width:0}
.lg-tag{font-weight:500;background:var(--text);color:var(--bg);padding:1px 7px;border-radius:4px;font-size:12.5px}
.lg-sys{color:var(--muted)}
.k-card .lg-sys{color:var(--text)}
.k-rec .lg-sys,.k-stop .lg-sys{color:var(--orange500)}
.lg-text{outline:none;min-width:40px;border-bottom:1px dashed transparent}
.lg-text:hover,.lg-text:focus{border-bottom-color:var(--g600)}
.lg-text:empty::before{content:attr(data-ph);color:var(--g600)}
.lg-q{color:var(--g600);font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-del{opacity:0;font-size:12px}
.lg-row:hover .lg-del{opacity:.7}
.lg-empty{padding:16px 14px;color:var(--muted);font-size:13.5px}
/* synk */
.sync-card{width:min(860px,100%)}
.sy-tabs{align-self:flex-start}
.sy-view{position:relative;background:#000;aspect-ratio:16/9;overflow:hidden;border-radius:8px}
.sy-view video,.sy-view canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .25s ease;cursor:zoom-in}
.sy-view canvas.zoom{transform:scale(2.6);cursor:zoom-out}
.sy-view video{cursor:crosshair}
.sy-roi{position:absolute;border:2px solid var(--green300);box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none;border-radius:3px}
.sy-ocr{font-size:13.5px;color:var(--muted);min-height:20px}
.ph-pair{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.ph-qr{background:#fff;border-radius:10px;padding:8px;width:220px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111}
.ph-qr svg{width:204px;height:204px}
.ph-link{font-size:12px;color:#555;margin-top:2px}
.ph-nourl{font-size:13px;padding:6px}.ph-nourl p{margin:6px 0;color:#444}.ph-nourl input{color:#111;background:#f2f2f2}
.ph-side{display:flex;flex-direction:column;gap:12px}
.ph-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.ph-conn{font-size:14px}
.sy-cal span{display:block;font-size:13px;color:#888;margin-top:4px}
/* mobilsidan */
body.mode-phone{overflow:auto}
.ph{max-width:640px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:10px}
.ph-h{display:flex;justify-content:space-between;align-items:baseline;font-size:17px}
.ph-h span{font-size:13px}
.mode-phone .sy-view{touch-action:none;aspect-ratio:4/3}
.ph-big{font-size:20px;padding:16px}
.ph-res{text-align:center}
.ph-code{font:500 34px ui-monospace,Menlo,monospace;letter-spacing:.08em;margin-top:6px}
.ph-auto{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px}.ph-auto input{width:auto}
.sy-diag{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.sy-help{font-size:13px;margin-bottom:8px}
.sy-help summary{cursor:pointer;color:var(--muted)}
.sy-help[open]{background:var(--field);padding:10px 12px;border-radius:8px}
.sy-help ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.sy-lockl{display:flex;align-items:center;gap:6px;color:var(--text);font-size:14px}
.sy-lockl input{width:auto}
.sy-adv summary{cursor:pointer;color:var(--muted);font-size:13px}
.sy-adv summary b{color:var(--text);font-weight:500}
.sy-adv[open]{background:var(--field);padding:10px 12px;border-radius:8px}
.sy-cal{margin-top:10px;background:#000;color:#fff;border-radius:8px;text-align:center;padding:18px 0}
.sy-cal div{font:500 72px ui-monospace,Menlo,monospace}
.st-calib{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:#000}
.cal-tc{font:500 250px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#fff;letter-spacing:0}
.cal-t{font-size:36px;color:#6f6864}
.sy-ov{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.75);color:#fff;font:500 20px ui-monospace,Menlo,monospace;padding:4px 10px;border-radius:4px}
.sy-ov:empty{display:none}
.sy-msg{position:absolute;inset:0;display:grid;place-items:center;color:#bbb;padding:30px;text-align:center}
.sy-msg:empty{display:none}
.sy-now{display:flex;justify-content:space-between;align-items:center;background:var(--field);padding:12px 14px;border-radius:8px}
.sy-now span{color:var(--muted);font-size:13px}
.sy-now b{font:500 30px ui-monospace,Menlo,monospace}
.tt-box{border:1px solid rgba(127,127,127,.3);border-radius:8px;padding:10px 12px;margin:10px 0}.tt-box h4{margin:0 0 6px}.tt-box .row{gap:8px;align-items:end;flex-wrap:wrap}.tt-bar{height:6px;background:rgba(127,127,127,.2);border-radius:3px;overflow:hidden;margin-top:6px}.tt-bar>div{height:100%;width:0;background:currentColor;transition:width .4s}.tt-ok{margin:4px 0 8px}
.ex-card{width:min(900px,100%)}
.ex-pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--field);padding:12px;max-height:42vh;overflow:auto;border-radius:8px;margin:0}
/* REC på värdskärmen */
.st-tc .rec-l{color:#ff6430;margin-right:14px;letter-spacing:.02em}
.next-box .nb-t{font-size:16px}
.kbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);margin-right:8px;vertical-align:1px}
.kbadge .hm{height:11px}
.badge{display:inline-block;font-size:11px;font-weight:600;color:var(--acc-fg);background:var(--acc);padding:2px 7px}

.side{overflow:auto;border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);padding:14px}
.panel button{background:var(--panel2)}
.panel button:hover{background:var(--panel3)}
.panel button.on{background:var(--sel)}
.cues{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.cues button{text-align:left;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.cues button kbd{float:right}
.cue-row{display:flex;gap:6px}
.cue-active{margin-top:8px;font-size:13px;color:var(--acc)}
.now-sec{color:var(--muted);font-size:13px;margin-bottom:8px}
.now-bg{white-space:pre-wrap;font-size:13.5px;background:var(--field);padding:10px 12px;margin:8px 0;border-left:3px solid var(--acc)}
.now-list{margin:6px 0;padding-left:22px}
.now-list li.rev{color:var(--acc)}
.muted{color:var(--muted)}
.qe textarea{margin-bottom:6px}
.hint{font-size:12px;color:var(--muted)}

/* ---------- Editor ---------- */
.op-edit{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:0}
.ed-side{border-right:1px solid var(--line);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.ed-side button{width:100%;text-align:left}
.ed-ep{padding:9px 11px;cursor:pointer;border-radius:6px}
.ed-ep:hover{background:var(--panel)}
.ed-ep.on{background:var(--sel);box-shadow:inset 0 0 0 1.5px var(--acc)}
.ed-ep small{display:block;color:var(--muted)}
.ed-main{overflow:auto;padding:20px 26px 120px}
.ed-wrap{max-width:920px;margin:0 auto}
.ed-meta{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:10px;margin-bottom:24px}
.ed-sec{margin-bottom:18px;background:var(--panel)}
.ed-sec-h{display:flex;gap:6px;align-items:center;padding:12px}
.ed-sec-h input{font-weight:500;font-size:16px;letter-spacing:var(--track-sub)}
.ed-cards{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.ed-card{padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.ed-card-top{display:flex;gap:8px;align-items:center}
.ed-card-top .hm{height:14px}
.ed-card-top select{width:auto}
.ed-card-top label{display:flex;gap:4px;align-items:center;white-space:nowrap}
.ed-card-top input[type=checkbox]{width:auto}
.ed-card .ed-main-text{font-size:17px;font-weight:500;letter-spacing:var(--track-sub)}
.ed-add{display:flex;gap:6px;flex-wrap:wrap}
.ed-add button{font-size:13px}
.ed-empty{color:var(--muted);padding:6px}
.ed-opt{display:flex;gap:4px}
.ed-opt button{font-size:13px;color:var(--muted)}

/* ---------- Modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(12,12,11,.7);display:grid;place-items:center;z-index:50;padding:20px}
.modal-card{background:var(--panel);padding:24px;width:min(780px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-card h3{margin:0;font-weight:500;font-size:26px;letter-spacing:var(--track-title)}
.modal-card p{margin:0;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.set-grid .full{grid-column:1/-1}
.set-font{display:flex;flex-direction:column;gap:5px;font-size:13px}
.set-brand{display:flex;flex-direction:column;gap:8px;background:var(--field);border-radius:10px;padding:12px 14px}
.brand-now{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.blogo.tile{height:26px;max-width:170px}
.brand-off{font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.brand-draft{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.brand-draft label{display:flex;flex-direction:column;gap:4px}.brand-draft label.cb{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:14px}.brand-draft input[type=checkbox]{width:auto}
.bd-logos,.bd-colors{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.bd-logo{background:#0c0c0b;padding:12px 16px;min-width:64px;min-height:54px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.bd-logo:hover{background:#0c0c0b}
.bd-logo.on,.bd-col.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--text)}
.bd-col{width:34px;height:34px;padding:0;border-radius:50%}
.bd-col:hover{filter:brightness(1.1)}
.set-grid label{display:flex;flex-direction:column;gap:5px}
.set-grid label.cb{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:14px}
.set-grid input[type=checkbox]{width:auto}
#impText{min-height:200px;max-height:300px;field-sizing:fixed;font-size:12.5px}
.imp-sum{font-size:13.5px;background:var(--field);padding:12px;max-height:220px;overflow:auto}
.imp-sum ul{margin:4px 0;padding-left:18px}
#toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;display:none;gap:12px;align-items:center;z-index:60}
#toast button{background:var(--bg);color:var(--text)}
#toast.show{display:flex}

/* ---------- Stage (preview + host display) – svart botten, vit text ---------- */
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#0c0c0b;color:#fff;overflow:hidden;font-family:var(--font);letter-spacing:-0.01em;--accent:#faf7f2;-webkit-font-smoothing:antialiased}
.st-c{position:absolute;inset:0}
.st{position:absolute;inset:0;display:flex;flex-direction:column;padding:60px 120px 0}
.st-top{display:flex;justify-content:space-between;align-items:center;height:72px;flex:none;font-size:30px;font-weight:400;letter-spacing:-0.02em;color:#6f6864}
.st-sec,.st-right{display:flex;gap:18px;align-items:center;white-space:nowrap}
.st-kind{color:#a59d98}
.blogo{display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff}
.blogo svg,.blogo img{height:100%;width:auto;max-width:100%;display:block}
.blogo.mono svg,.blogo.mono img{filter:brightness(0) invert(1)}
.st-right .blogo{height:54px;max-width:300px;margin-left:12px}
.st-fu-hint{color:var(--accent)}
.st-pos{font-variant-numeric:tabular-nums}
.fu-pre{font-size:.42em;color:#6f6864;margin-top:1.1em;line-height:1.12;letter-spacing:-0.025em;text-wrap:balance}
.fu-pre .fu-label{font-size:.66em;color:#4f4a47}
/* tidskod */
.st-tc{position:absolute;top:60px;height:72px;left:0;right:0;margin:auto;width:fit-content;display:flex;align-items:center;gap:0;font-size:28px;color:#4f4a47;letter-spacing:0;pointer-events:none;transition:color .3s}
.st-tc.off{display:none}
.st-tc i{display:inline-block;width:.6em;text-align:center;font-style:normal}
.st-tc b{display:inline-block;width:.32em;text-align:center;font-weight:400;opacity:.7}
.st-tc .dot{width:12px;height:12px;border-radius:50%;background:#3a3735;margin-right:14px}
.st-tc.run{color:#a59d98}
.st-tc.rec .dot{background:#ff6430;animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
/* övergångar */
.w{display:inline-block}
.w,.rise{animation:wIn .6s cubic-bezier(.16,.84,.3,1) both;animation-delay:calc(var(--d,0ms) + var(--i,0)*16ms)}
.dir-back .w,.dir-back .rise{animation-name:wInBack}
@keyframes wIn{from{opacity:0;transform:translateY(.38em);filter:blur(8px)}}
@keyframes wInBack{from{opacity:0;transform:translateY(-.3em);filter:blur(8px)}}
.shrink{animation:shrink .55s cubic-bezier(.3,.7,.2,1) both}
@keyframes shrink{from{font-size:1em;color:#fff;margin-bottom:.25em}}
.chip-in{animation:wIn .45s cubic-bezier(.16,.84,.3,1) both}
.fade-in{animation:fadeIn .5s ease both}
@keyframes fadeIn{from{opacity:0}}
.st-out{pointer-events:none;z-index:0}
.out-up{animation:outUp .22s cubic-bezier(.55,0,.8,.2) forwards}
.out-down{animation:outDown .22s cubic-bezier(.55,0,.8,.2) forwards}
.out-fade{animation:outFade .45s ease forwards}
@keyframes outUp{to{opacity:0;transform:translateY(-40px);filter:blur(4px)}}
@keyframes outDown{to{opacity:0;transform:translateY(40px);filter:blur(4px)}}
@keyframes outFade{to{opacity:0}}
.out-up .st-top,.out-down .st-top{opacity:0}
.soft-in .fit-inner{animation:fadeIn .3s ease both}
.fit{flex:1;min-height:0;display:flex;overflow:hidden;padding:24px 0}
.fit-inner{margin:auto 0;width:100%}
.q{font-weight:400;line-height:1.02;letter-spacing:-0.035em;text-wrap:balance}
.q-ctx{font-size:.45em;color:#6f6864;margin-bottom:.8em;line-height:1.1;letter-spacing:-0.025em}
.fu-label,.info-label,.m-label{font-size:.28em;font-weight:400;letter-spacing:-0.015em;color:#8f8783;margin-bottom:.4em}
.info{font-size:.32em;line-height:1.28;color:#a59d98;margin-top:1.5em;padding-top:.8em;border-top:2px solid #232322;letter-spacing:-0.015em}
.info .info-label{font-size:.85em}
.m-title{line-height:1;letter-spacing:-0.035em;margin-bottom:.45em}
.m-rules{font-size:.4em;line-height:1.22;color:#a59d98;margin-bottom:1.1em;letter-spacing:-0.02em;text-wrap:pretty}
.m-label{font-size:.3em}
.m-item{font-size:1.3em;line-height:1;letter-spacing:-0.04em;margin:.05em 0 .5em;text-wrap:balance}
.m-prev{display:flex;flex-wrap:wrap;gap:.9em;font-size:.3em;color:#6f6864;letter-spacing:-0.015em}
.m-prev b{font-weight:400;color:#a59d98;margin-right:.35em}
.sc-dir{font-size:.46em;color:#6f6864;margin:.55em 0;line-height:1.2;letter-spacing:-0.02em}
.sc-line{margin:.4em 0;line-height:1.03;letter-spacing:-0.035em}
.sc-name{display:block;font-size:.38em;letter-spacing:-0.015em;color:#8f8783;margin-bottom:.15em}
.sc-line.me{color:#fff}
.sc-line.other{color:#8f8783}
.st-next{height:110px;flex:none;display:flex;align-items:center;gap:22px;font-size:32px;color:#4f4a47;min-width:0;letter-spacing:-0.02em}

@keyframes spin{to{transform:rotate(360deg)}}

.cue-layer{position:absolute;inset:0;pointer-events:none}
.cue{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;max-width:1720px;top:40px;background:var(--accent);color:var(--accent-fg,#0c0c0b);font-size:76px;letter-spacing:-0.035em;line-height:1.05;padding:22px 92px;text-align:center;
  clip-path:polygon(46px 0,calc(100% - 46px) 0,100% 50%,calc(100% - 46px) 100%,46px 100%,0 50%);animation:cueIn .3s ease-out,cuePulse 1.1s ease-in-out .3s 3}
@keyframes cueIn{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@keyframes cuePulse{50%{transform:scale(1.04)}}

/* ---------- Host display window ---------- */

  .side .panel{flex:1 1 300px}

}

<body>
<script>
'use strict';
/* ======================================================================
   Logsync – frågeskärm för programledare, med logg mot kamerans tidskod
   En fil. Operatören (#) styr, värdskärmen (#display) visar, mobilen (#phone) läser tidskod.
   All data (manus, logg, inställningar, typsnitt) ligger i webbläsarens lagring, inte i koden.
   ====================================================================== */

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,10);

const LS_FONTS='vh.fonts.v1',LS_BRAND='vh.brand.v1';
const LS_DATA='vh.data.v1', LS_LIVE='vh.live.v1', LS_SETTINGS='vh.settings.v1', LS_VM='vh.vm.v1', LS_LOG='vh.log.v1';
// Tidskod: [nominella rutor per TC-sekund, verkliga rutor per sekund]
const FPS={'23.976':[24,24000/1001],'24':[24,24],'25':[25,25],'29.97':[30,30000/1001],'30':[30,30],'50':[50,50],'59.94':[60,60000/1001],'60':[60,60]};
const p2=n=>String(n).padStart(2,'0');
function midnight(ms){const d=new Date(ms);d.setHours(0,0,0,0);return d.getTime();}
function resolveSync(sync,fps,ms){return sync&&FPS[sync.fps]?sync:{t0:midnight(ms),baseFrames:0,fps:FPS[fps]?fps:'25',clock:true};}
function camFrames(sync,ms){return sync.baseFrames+(ms-sync.t0)/1000*FPS[sync.fps][1]*(sync.rate||1);}
function clockFrames(fps,ms){return (ms-midnight(ms))/1000*FPS[fps][1];}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function framesToTC(fr,nom,noFrames){fr=Math.floor(fr+1e-6);const day=nom*86400;fr=((fr%day)+day)%day;const f=fr%nom,sec=Math.floor(fr/nom);
  const t=`${p2(Math.floor(sec/3600))}:${p2(Math.floor(sec/60)%60)}:${p2(sec%60)}`;return noFrames?t:t+':'+p2(f);}
function parseTC(str,nom){
  const g=String(str||'').match(/\d+/g);if(!g) return null;let parts;
  if(g.length===1&&g[0].length>=6){const d=g[0].padEnd(8,'0');parts=[d.slice(0,2),d.slice(2,4),d.slice(4,6),d.slice(6,8)];}
  else if(g.length>=3) parts=[...g,'0'].slice(0,4); else return null;
  const [h,m,sec,f]=parts.map(Number);
  if(h>23||m>59||sec>59||f>=nom) return null;
  return (h*3600+m*60+sec)*nom+f;
}
function fmtDur(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+p2(s%60);}
const CH=('BroadcastChannel' in window)?new BroadcastChannel('vh-sync'):null;
const MODE=location.hash.startsWith('#display')?'display':location.hash.startsWith('#phone')?'phone':'operator';

const KINDS={core:'Kärnfråga',guest:'Gästfråga',moment:'Moment',script:'Manus',info:'Info / slide'};
// Små former som skiljer korttyperna åt i listan
const HM_PATH={oval:['0 0 100 70','<ellipse cx="50" cy="35" rx="48" ry="32"/>'],
  link:['0 0 124 70','<circle cx="36" cy="35" r="33"/><circle cx="88" cy="35" r="33"/>'],
  hourglass:['0 0 100 70','<polygon points="50,2 98,35 50,68 2,35"/>'],
  shield:['0 0 100 70','<rect x="6" y="6" width="88" height="58" rx="14"/>']};
const KIND_HM={core:['oval','#a8ceff'],guest:['link','#66a8ff'],moment:['hourglass','#ff9c55'],script:['shield','#e782f7'],info:['oval','#bdb0aa']};
const hm=k=>{const [n,c]=KIND_HM[k]||KIND_HM.info,[vb,d]=HM_PATH[n];return `<svg class="hm" viewBox="${vb}" style="fill:${c}" aria-hidden="true">${d}</svg>`;};
const accentOptions=()=>{const o=Object.entries(ACCENTS),have=new Set(o.map(x=>x[0]));((BRAND&&BRAND.colors)||[]).forEach(c=>{if(!have.has(c)){have.add(c);o.push([c,'Branding '+c]);}});if(!have.has(settings.accent)) o.push([settings.accent,settings.accent]);return o;};
const ACCENTS={'#faf7f2':'Vit (standard)','#d7fa6f':'Lime','#a8ceff':'Ljusblå','#ff9c55':'Orange','#e782f7':'Lila'};
const HOST_LABELS={
  sv:{core:'Kärnfråga',guest:'Gästfråga',moment:'Moment',script:'Manus',info:'Info',followUp:'Följdfråga',next:'Nästa',background:'Bakgrund',empty:'Inget kort valt'},
  en:{core:'Core question',guest:'Guest question',moment:'Moment',script:'Script',info:'Note',followUp:'Follow-up',next:'Next',background:'Background',empty:'No card selected'}
};
const DEFAULT_SETTINGS={
  fontScale:1, showNext:true, tcMode:'timer', showProgress:true, previewFollowUp:true, animations:true,
  mirror:false, hostLang:'sv', accent:'#faf7f2', cueSeconds:8, showMark:true, hostName:'Programledare',
  cues:['Följdfråga?','Gå vidare','Avrunda','30 sek kvar','Ta om frågan','Snyggt – fortsätt'],
  fps:'25', tcSync:null, camLatency:80, ocrRoi:null, syncOnRec:true, camDeviceId:null, phoneSession:null, publicUrl:'https://philipatspoon.github.io/logsync/',
  logTags:['Bra svar','Bra tagning','Omtag','Klipp bort','Citat','Skratt','Strul','Tappade tråden']
};
// Inställningar som hör till den här datorn och inspelningsdagen – följer inte med i backup eller återställning
const MACHINE_KEYS=['tcSync','fps','camLatency','ocrRoi','camDeviceId','phoneSession','publicUrl'];
const keepMachine=S=>Object.fromEntries(MACHINE_KEYS.filter(k=>k in S).map(k=>[k,S[k]]));
const DEFAULT_LIVE={cardId:null,reveal:0,blackout:false,showInfo:false,cue:null,visited:{},skipped:{},timer:{running:false,startedAt:0,acc:0},rec:{on:false,clip:0,lastKey:null}};

/* ---------------------------------------------------------------------
   Branding – logotyp, namn och färger. Hämtas från en webbplats eller läggs in för hand,
   sparas i webbläsaren och används i alla fönster. Ingen branding ligger i koden.
   --------------------------------------------------------------------- */
let BRAND=null;
function getBrand(){try{const b=JSON.parse(localStorage.getItem(LS_BRAND));return b&&typeof b==='object'?b:null;}catch(e){return null;}}
function loadBrand(){BRAND=getBrand();}
// Rensar en SVG från allt som kan köra kod eller hämta något utifrån
function cleanSvg(src){
  const doc=new DOMParser().parseFromString('<!doctype html><body>'+String(src||''),'text/html'),svg=doc.querySelector('svg');if(!svg) return null;
  svg.querySelectorAll('script,foreignObject,iframe,object,embed,audio,video,animate,set,animateTransform,animateMotion,title,desc').forEach(n=>n.remove());
  svg.querySelectorAll('a').forEach(n=>n.replaceWith(...n.childNodes));
  svg.querySelectorAll('style').forEach(n=>{if(/@import|url\(|expression/i.test(n.textContent)) n.remove();});
  [svg,...svg.querySelectorAll('*')].forEach(n=>{for(const at of [...n.attributes]){const k=at.name.toLowerCase(),v=at.value.trim();
    if(k.startsWith('on')||((k==='href'||k==='xlink:href')&&!/^(#|data:image\/(png|jpeg|webp|gif);)/i.test(v))||(k==='style'&&/url\(|expression|@import/i.test(v))) n.removeAttribute(at.name);}});
  if(!svg.getAttribute('viewBox')){const w=parseFloat(svg.getAttribute('width')),h=parseFloat(svg.getAttribute('height'));if(w>0&&h>0) svg.setAttribute('viewBox',`0 0 ${w} ${h}`);else return null;}
  ['width','height','class','id','style'].forEach(k=>svg.removeAttribute(k));svg.setAttribute('aria-hidden','true');
  const vb=svg.getAttribute('viewBox').split(/[\s,]+/).map(Number),ratio=vb[3]>0?+(vb[2]/vb[3]).toFixed(2):1;
  return {kind:'svg',svg:svg.outerHTML,ratio};
}
function cleanLogo(l){
  if(!l) return null;
  if(l.kind==='svg'){const c=cleanSvg(l.svg);return c?{...c,label:l.label||''}:null;}
  return l.kind==='img'&&/^data:image\/(png|jpeg|webp|gif|x-icon|vnd\.microsoft\.icon);base64,/i.test(l.src||'')?{kind:'img',src:l.src,ratio:+l.ratio||1,label:l.label||''}:null;
}
function saveBrand(b){
  if(b){b={url:String(b.url||''),name:String(b.name||''),logo:cleanLogo(b.logo),mono:b.mono!==false,colors:(b.colors||[]).filter(c=>/^#[0-9a-f]{6}$/i.test(c)).slice(0,12)};
    if(!write(LS_BRAND,b)){toast('Logotypen fick inte plats i webbläsarens lagring. Välj en mindre fil.');return false;}}
  else localStorage.removeItem(LS_BRAND);
  loadBrand();try{CH&&CH.postMessage({type:'vh:brand'});}catch(e){}
  refitStages();if(typeof renderBrandHeader==='function') renderBrandHeader();
  return true;
}
// Logotypen som HTML. cls: corner (värdskärmens hörn), big (standby), hdr (operatörens sidhuvud), tile (förhandsvisning)
function logoHTML(l,cls,mono){
  if(!l) return '';
  const c=`blogo ${cls}${mono?' mono':''}${cls==='big'&&l.ratio>=0.8&&l.ratio<=1.25?' spin':''}`;
  return l.kind==='svg'?`<span class="${c}">${l.svg}</span>`:`<span class="${c}"><img src="${esc(l.src)}" alt=""></span>`;
}
const brandLogo=cls=>BRAND&&BRAND.logo?logoHTML(BRAND.logo,cls,BRAND.mono!==false):'';
// Mörk eller ljus text på en färg
function darkOn(hex){const m=/^#([0-9a-f]{6})$/i.exec(hex||'');if(!m) return true;const n=parseInt(m[1],16),r=n>>16,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>140;}

/* ---------------------------------------------------------------------
   Typsnitt – egna typsnittsfiler sparas i webbläsaren och används i alla fönster
   --------------------------------------------------------------------- */
function getFonts(){try{const f=JSON.parse(localStorage.getItem(LS_FONTS));return f&&Array.isArray(f.faces)?f:{faces:[]};}catch(e){return {faces:[]};}}
function applyFonts(){
  let st=document.getElementById('userFonts');if(!st){st=document.createElement('style');st.id='userFonts';document.head.appendChild(st);}
  st.textContent=getFonts().faces.map(f=>`@font-face{font-family:"VH Custom";src:url(${f.data});font-weight:${/^\d{3}( \d{3})?$/.test(String(f.weight))?f.weight:400};font-style:normal;font-display:block}`).join('\n');
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(refitStages);
}
// Texten passas in efter typsnittets mått: passa in igen när ett typsnitt har laddats
function refitStages(){document.querySelectorAll('.stage').forEach(el=>{if(el._v){el._plain=null;renderStage(el,el._v);}});}
function fontWeight(name,buf){
  try{ // TTF/OTF: läs vikten ur OS/2-tabellen
    const d=new DataView(buf),n=d.getUint16(4);
    for(let i=0;i<n;i++){const o=12+i*16;if(d.getUint32(o)===0x4f532f32) return d.getUint16(d.getUint32(o+8)+4);}
  }catch(e){}
  const m=String(name).toLowerCase();
  return /thin|hairline/.test(m)?100:/extra\s*-?light|ultra\s*-?light/.test(m)?200:/light/.test(m)?300:/medium/.test(m)?500:/semi\s*-?bold|demi/.test(m)?600:/extra\s*-?bold|ultra\s*-?bold/.test(m)?800:/bold/.test(m)?700:/black|heavy/.test(m)?900:400;
}
async function addFontFiles(files){
  const cur=getFonts(),types={ttf:'font/ttf',otf:'font/otf',woff:'font/woff',woff2:'font/woff2'};
  for(const f of files){
    const ext=f.name.split('.').pop().toLowerCase();if(!types[ext]){toast(`${f.name}: okänt format (använd .woff2, .ttf eller .otf)`);continue;}
    const buf=await f.arrayBuffer(),w=fontWeight(f.name,buf);
    let bin='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000) bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
    cur.faces=cur.faces.filter(x=>x.weight!==w);cur.faces.push({weight:w,name:f.name,data:`data:${types[ext]};base64,${btoa(bin)}`});
  }
  cur.faces.sort((a,b)=>a.weight-b.weight);
  if(!write(LS_FONTS,cur)){toast('Typsnittet fick inte plats i webbläsarens lagring. Använd .woff2-filer, de är minst.');return;}
  applyFonts();try{CH&&CH.postMessage({type:'vh:fonts'});}catch(e){}
}
function fontStatus(){const F=getFonts(),f=F.faces;return f.length?(F.family?`<b>${esc(F.family)}</b>: `:'')+f.map(x=>`${esc(x.name)} (${esc(x.weight)})`).join(', '):'Inget eget typsnitt inläst – systemets typsnitt används';}

/* ---------------------------------------------------------------------
   PARSER – tolkar manus (Google Docs-HTML eller ren text) till en episod
   --------------------------------------------------------------------- */
// PARSER-START
const RX={
  followUp:/(follow[\s-]?up|följdfråga|uppföljning)\s*:\s*/i,
  background:/^(background|bakgrund)\s*:\s*/i,
  bullet:/^\s*(?:[•●◦▪▫■□\-–*]|\d+[.)])\s+/,
  section:/^(block|moment|outro|intro|avslutning|segment)\b/i,
  sub:/^(core|guest|kärn|gäst|bas)\w*\s*(questions?|frågor|fråga)?\s*:?\s*$/i
};
function newCard(kind,text){return {id:uid(),kind,text:text||'',followUp:'',background:'',rules:'',listLabel:'',list:[],recurring:false,scale:1};}
function mkQuestion(raw,kind){
  let text=raw, followUp='';
  const m=raw.match(RX.followUp);
  if(m){followUp=raw.slice(m.index+m[0].length).trim();text=raw.slice(0,m.index).trim();}
  const c=newCard(kind,text);
  if(/↻/.test(c.text)){c.recurring=true;c.text=c.text.replace(/\s*↻\s*/g,' ').trim();}
  c.followUp=followUp.replace(/\s*↻\s*/g,' ').trim();
  return c;
}
function textToLines(txt){
  const out=[];let first=true;
  for(const raw of String(txt).replace(/\r/g,'').split('\n')){
    const t=raw.replace(/\u00a0/g,' ').trim(); if(!t) continue;
    if(first){out.push({type:'h1',text:t});first=false;continue;}
    if(RX.bullet.test(t)) out.push({type:'li',text:t.replace(RX.bullet,'')});
    else if(RX.sub.test(t)) out.push({type:'h3',text:t});
    else if(RX.section.test(t)) out.push({type:'h2',text:t});
    else out.push({type:'p',text:t});
  }
  return out;
}
// Docs lägger ibland flera rader i samma stycke med mjuka radbrytningar (Shift+Enter), t.ex.
// "Background: …⏎⏎BLOCK 2". Dela upp så att varje rubrik hamnar på en egen rad.
function expandLines(lines){
  const out=[],isHead=p=>p.length<70&&!/\?\s*↻?$/.test(p)&&(RX.section.test(p)||RX.sub.test(p));
  for(const ln of lines){
    const t=String(ln.text||'').replace(/\u000b/g,'\n');
    if(ln.type==='h1'||ln.type==='h2'||!t.includes('\n')){out.push(ln);continue;}
    let buf=[];const flush=()=>{if(buf.join('').trim()) out.push({type:ln.type,text:buf.join('\n')});buf=[];};
    for(const part of t.split('\n')){const q=part.trim();if(q&&isHead(q)){flush();out.push({type:RX.sub.test(q)?'h3':'h2',text:q});}else buf.push(part);}
    flush();
  }
  return out;
}
function parseScript(lines){
  lines=expandLines(lines);
  const ep={id:uid(),title:'',guest:'',guestTitle:'',sections:[]};
  let sec=null,kind='core',last=null,moment=null,script=null,preCount=0;
  const add=t=>(t?t+'\n':'');
  const newSec=title=>{
    sec={id:uid(),title:(title||'Sektion').trim(),cards:[]};ep.sections.push(sec);
    kind='core';last=null;moment=null;script=null;
    if(/moment/i.test(title)){moment=newCard('moment',title.replace(/^moment\s*[–—:\-]?\s*/i,'').trim()||title);sec.cards.push(moment);last=moment;}
    else if(/outro|intro|avslutning/i.test(title)){script=newCard('script','');sec.cards.push(script);last=script;}
  };
  for(const raw of lines){
    const text=String(raw.text||'').replace(/\u000b/g,'\n').replace(/\u00a0/g,' ').replace(/[ \t]+\n/g,'\n').replace(/^\n+/,'').trim();
    if(!text) continue;
    // Formateringen från Docs är opålitlig (rubriker blir ibland vanlig text): känn igen blocken på texten
    let type=raw.type;
    if(type!=='h1'&&type!=='h2'&&type!=='h3'&&!text.includes('\n')&&text.length<70&&!/\?\s*↻?$/.test(text)){
      if(RX.sub.test(text)) type='h3';else if(RX.section.test(text)) type='h2';
    }
    const ln={type,text};
    // Titel + gäst före första sektionen
    if(!sec && !ep.title && (ln.type==='h1'||ln.type==='p'||ln.type==='h2') && !RX.section.test(text)){ep.title=text.replace(/\n/g,' ');continue;}
    if(!sec && ln.type==='p' && !RX.section.test(text)){
      if(preCount===0){const [g,...rest]=text.split('\n');ep.guest=g.trim();ep.guestTitle=rest.join(' ').trim();}
      else if(preCount===1 && !ep.guestTitle) ep.guestTitle=text;
      preCount++;continue;
    }
    if(ln.type==='h1'||ln.type==='h2'){
      const parts=text.split('\n').map(s=>s.trim()).filter(Boolean);
      const qs=parts.filter(p=>/\?\s*↻?$/.test(p));
      const rest=parts.filter(p=>!qs.includes(p));
      if(qs.length){if(!sec) newSec('Inledning');qs.forEach(q=>sec.cards.push(mkQuestion(q,'core')));}
      newSec(rest.join(' ')||'Sektion');
      continue;
    }
    if(ln.type==='h3'){
      if(!sec) newSec('Block 1');
      kind=/gäst|guest/i.test(text)?'guest':'core';
      continue;
    }
    if(!sec) newSec('Block 1');
    let m;
    if((m=text.match(RX.background))){if(last) last.background=add(last.background)+text.slice(m[0].length);continue;}
    if((m=text.match(RX.followUp)) && m.index===0){if(last) last.followUp=add(last.followUp)+text.slice(m[0].length);continue;}
    if(script){script.text=add(script.text)+text;continue;}
    if(moment){
      if(ln.type==='li') moment.list.push(text);
      else if(/:\s*$/.test(text) && !moment.list.length && text.length<60) moment.listLabel=text.replace(/:\s*$/,'');
      else moment.rules=add(moment.rules)+text;
      continue;
    }
    // Inledning och fråga på separata rader hör ihop; avslutningsfrågan är en kärnfråga
    const leadIn=last&&last.kind===kind&&(kind==='core'||kind==='guest')&&!last.followUp&&!last.background&&!/\?\s*↻?$/.test(last.text);
    if(ln.type!=='li'&&leadIn&&/\?\s*↻?$/.test(text)){last.text+='\n'+text;continue;}
    if(ln.type!=='li'&&/^(is there anything|finns det något)/i.test(text)){last=mkQuestion(text,'core');sec.cards.push(last);continue;}
    if(ln.type==='li' || /\?|↻/.test(text)){last=mkQuestion(text,kind);sec.cards.push(last);}
    else if(last) last.background=add(last.background)+text;
    else {last=newCard('info',text);sec.cards.push(last);}
  }
  return ep;
}

function htmlToLines(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const out=[];
  const BLK=/^(P|DIV|LI|H[1-6]|TR|UL|OL)$/;
  const deep=el=>{let s='';for(const n of el.childNodes){
    if(n.nodeType===3) s+=n.nodeValue;
    else if(n.nodeName==='BR') s+='\n';
    else if(n.nodeType===1){const b=BLK.test(n.nodeName);if(b&&s&&!s.endsWith('\n')) s+='\n';s+=deep(n);if(b) s+='\n';}
  }return s;};
  const clean=s=>s.replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{2,}/g,'\n').trim();
  (function walk(el){for(const n of el.children){
    const t=n.tagName;
    if(/^H[1-6]$/.test(t)) out.push({type:t==='H1'?'h1':t==='H2'?'h2':'h3',text:clean(deep(n))});
    else if(t==='LI') out.push({type:'li',text:clean(deep(n))});
    else if(t==='P') out.push({type:n.classList.contains('title')?'h1':'p',text:clean(deep(n))});
    else if(/^(STYLE|SCRIPT|META|TITLE)$/.test(t)) continue;
    else walk(n);
  }})(doc.body);
  return out;
}

function fmtTime(ms){ms=Math.max(0,ms|0);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s/60)%60,ss=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;}
const timerMs=t=>t?(t.acc+(t.running?Date.now()-t.startedAt:0)):0;

function scriptLines(text,hostName){
  return String(text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^([A-ZÅÄÖ][\wÅÄÖåäöéü .'\-]{0,24}):\s+(.+)$/);
    if(m){const me=hostName && m[1].trim().toLowerCase()===hostName.toLowerCase();
      return `<div class="sc-line ${me?'me':'other'}"><span class="sc-name">${esc(m[1])}</span>${esc(m[2])}</div>`;}
    return `<div class="sc-dir">${esc(l)}</div>`;
  }).join('');
}

// Ord-för-ord-spans för animation (on=false ger vanlig text)
function W(text,on,base=0){
  if(!on) return nl2br(text);
  let i=0;
  return String(text||'').split('\n').map(line=>line.split(/\s+/).filter(Boolean)
    .map(w=>`<span class="w" style="--i:${Math.min(i++,30)};--d:${base}ms">${esc(w)}</span>`).join(' ')).join('<br>');
}
const R=(on,i,base=0)=>on?` rise" style="--i:${i};--d:${base}ms`:'';

function stageHTML(v,mode){
  if(!v) return `<div class="st-empty">…</div>`;
  if(v.calib) return `<div class="st-calib"><div class="cal-tc" data-cal></div><div class="cal-t">Kalibrering · rikta kameran hit</div></div>`;
  if(v.blackout) return `<div class="st-black${mode==='fade'?' fade-in':''}">${brandLogo('big')}<div>${esc(v.showTitle||'')}</div></div>`;
  if(v.empty) return `<div class="st-empty">${esc(v.L.empty)}</div>`;
  const L=v.L,card=mode==='card'||mode==='fade',rev=mode==='reveal',D=card?230:0;
  let body='';
  if(v.kind==='moment'){
    const n=v.list.length,k=v.revealed;
    if(k<=0||!n){
      body=`<div class="m-title">${W(v.text,card,D)}</div>${v.rules?`<div class="m-rules${R(card,6,D)}">${nl2br(v.rules)}</div>`:''}${n?`<div class="m-label${R(card,9,D)}">${esc(v.listLabel||'')}${v.listLabel?' · ':''}${n} st</div>`:''}`;
    }else{
      const on=card||rev;
      body=`<div class="m-label">${esc(v.listLabel||v.text)} · ${k} / ${n}</div><div class="m-item">${W(v.list[k-1],on,D)}</div>`+
        (k>1?`<div class="m-prev">${v.list.slice(0,k-1).map((x,i)=>`<span class="${rev&&i===k-2?'chip-in':''}"><b>${i+1}</b>${esc(x)}</span>`).join('')}</div>`:'');
    }
  }else if(v.kind==='script'){
    let n=0;
    body=scriptLines(v.text,v.hostName);
    if(card) body=body.replace(/<div class="(sc-[a-z]+[^"]*)"/g,(m,c)=>`<div class="${c} rise" style="--i:${Math.min(n++*3,36)};--d:${D}ms"`);
  }else if(v.followUp){
    body=`<div class="q q-ctx${rev?' shrink':''}">${nl2br(v.text)}</div><div class="fu-label${R(rev||card,0,rev?120:D)}">${esc(L.followUp)}</div><div class="q">${W(v.followUp,rev||card,rev?160:D+80)}</div>`;
  }else{
    body=`<div class="q">${W(v.text,card,D)}</div>`;
    if(v.fuPreview) body+=`<div class="fu-pre${R(card,14,D)}"><div class="fu-label">${esc(L.followUp)}</div>${nl2br(v.fuPreview)}</div>`;
  }
  if(v.info) body+=`<div class="info${R(true,0,0)}"><div class="info-label">${esc(L.background)}</div>${nl2br(v.info)}</div>`;
  const right=[
    v.hasFollowUp&&!v.followUp&&!v.fuPreview?`<span class="st-fu-hint">+ ${esc(L.followUp)}</span>`:'',
    v.showProgress&&v.pos?`<span class="st-pos">${esc(v.pos)}</span>`:'',
    v.showMark?brandLogo('corner'):''
  ].join('');
  return `<div class="st">
    <div class="st-top"><div class="st-sec">${v.section.toLowerCase().includes((L[v.kind]||'').toLowerCase())?'':`<span class="st-kind">${esc(L[v.kind]||'')}</span><span>·</span>`}<span>${esc(v.section)}</span>${v.recurring?'<span>↻</span>':''}</div><div class="st-right">${right}</div></div>
    <div class="fit"><div class="fit-inner">${body}</div></div>
    <div class="st-next${card?' fade-in':''}">${v.showNext&&v.next?`<span class="lbl">${esc(L.next)}</span><span class="txt">${v.nextSection?`<em>${esc(v.nextSection)} · </em>`:''}${esc(v.next)}</span>`:''}</div>
    <div class="st-progress"><i style="width:${(v.overall*100).toFixed(1)}%"></i></div>
  </div>`;
}

// Hitta största storlek som får plats, skala sedan med vald textstorlek
function fitStage(root,scale){
  const fit=root.querySelector('.fit'),inner=root.querySelector('.fit-inner');
  if(!fit||!inner) return;
  const s=scale||1;
  let lo=18,hi=Math.round(165*Math.max(s,1)),best=lo;
  const ok=()=>inner.scrollHeight<=fit.clientHeight-40+1 && inner.scrollWidth<=fit.clientWidth+1;
  for(let i=0;i<13;i++){const mid=(lo+hi)/2;inner.style.fontSize=mid+'px';if(ok()){best=mid;lo=mid;}else hi=mid;}
  inner.style.fontSize=Math.floor(s<1?best*s:best)+'px';
}

function transitionMode(el,v){
  const key=!v?'':v.blackout?'B':`${v.id||''}|${v.revealed||0}`,prev=el._key;
  el._key=key;
  if(prev===undefined||prev===key||!v||v.animate===false) return {mode:'none'};
  if(prev==='B'||key==='B') return {mode:'fade'};
  const [pid,pr]=prev.split('|'),[nid,nr]=key.split('|');
  if(pid===nid) return {mode:+nr>+pr?'reveal':'soft'};
  return {mode:'card',back:(v.overall||0)<(el._overall||0)};
}
function renderStage(el,v){
  if(!el._c){
    el.innerHTML='<div class="st-c"></div><div class="st-tc"></div><div class="cue-layer"></div>';
    el._c=el.children[0];el._tc=el.children[1];el._q=el.children[2];
  }
  if(v){el.style.setProperty('--accent',v.accent||'#faf7f2');el.style.setProperty('--accent-fg',darkOn(v.accent||'#faf7f2')?'#0c0c0b':'#fff');}
  const {mode,back}=transitionMode(el,v);
  if(mode==='card'||mode==='fade'){
    el.querySelectorAll('.st-out').forEach(n=>n.remove());
    const out=el._c.cloneNode(true);out.className='st-c st-out '+(mode==='fade'?'out-fade':back?'out-down':'out-up');
    el.insertBefore(out,el._c);setTimeout(()=>out.remove(),500);
  }
  // Rita inte om när inget ändrats – annars avbryts pågående animationer
  const plain=stageHTML(v,'none');
  if(mode==='none'&&plain===el._plain&&el._fs===(v&&v.fontScale)){el._v=v;updateCue(el);tickStage(el);return;}
  el._plain=plain;el._fs=v&&v.fontScale;
  el.classList.toggle('dir-back',!!back);
  el._c.innerHTML=mode==='none'?plain:stageHTML(v,mode);
  el._c.classList.toggle('soft-in',mode==='soft');
  if(mode==='soft'){void el._c.offsetWidth;}
  if(v&&!v.blackout) fitStage(el._c,v.fontScale);
  el._v=v;el._overall=v?v.overall:0;
  updateCue(el);tickStage(el);
}
function cueVisible(v){return v&&v.cue&&(!v.cue.ttl||Date.now()<v.cue.ts+v.cue.ttl*1000);}
function updateCue(el){
  const v=el._v,vis=cueVisible(v),key=vis?v.cue.ts+'|'+v.cue.text:0;
  if(el._ck===key) return;el._ck=key;
  el._q.innerHTML=vis?`<div class="cue">${esc(v.cue.text)}</div>`:'';
}
function tickCal(el,fps){
  const c=el&&el.querySelector('[data-cal]');if(!c) return;
  const now=Date.now(),f=FPS[fps]?fps:'25';c.textContent=framesToTC(clockFrames(f,now),FPS[f][0]);
}
function tcString(v){
  if(!v||v.tcMode==='off') return '';
  if(v.tcMode==='clock') return new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(v.tcMode==='camera'){const now=Date.now(),sy=resolveSync(v.tcSync,v.fps,now);return framesToTC(camFrames(sy,now),FPS[sy.fps][0],true);}
  return fmtTime(timerMs(v.timer));
}
function tickStage(el){
  const v=el._v;if(!v||!el._tc) return;
  const str=tcString(v),rec=!!v.rec||(v.tcMode==='timer'&&v.timer&&v.timer.running),run=rec||v.tcMode==='clock'||v.tcMode==='camera',k=str+run+rec+!!v.rec;
  if(el._tck!==k){el._tck=k;
    el._tc.className='st-tc'+(run?' run':'')+(rec?' rec':'')+(str?'':' off');
    el._tc.innerHTML=str?`<span class="dot"></span>${v.rec?'<span class="rec-l">REC</span>':''}`+[...str].map(c=>/\d/.test(c)?`<i>${c}</i>`:`<b>${c}</b>`).join(''):'';
  }
  updateCue(el);
}

function initDisplay(){
  document.title='Logsync – värdskärm';
  document.body.className='mode-display';
  document.body.innerHTML='<div class="stage" id="dStage"></div><div class="d-hint" id="dHint">Väntar på operatören…</div>';
  const stage=$('#dStage'),hint=$('#dHint');
  addEventListener('storage',e=>{if(e.key===LS_FONTS) applyFonts();if(e.key===LS_BRAND){loadBrand();refitStages();}});
  if(CH) CH.addEventListener('message',e=>{const t=e.data&&e.data.type;if(t==='vh:fonts') applyFonts();if(t==='vh:brand'){loadBrand();refitStages();}});
  let lastTs=0,gotVm=false,mirror=false;
  const layout=()=>{
    const W=innerWidth,H=innerHeight,s=Math.min(W/1920,H/1080),ox=(W-1920*s)/2,oy=(H-1080*s)/2;
    stage.style.transform=mirror?`translate(${ox+1920*s}px,${oy}px) scale(${-s},${s})`:`translate(${ox}px,${oy}px) scale(${s})`;
  };
  const updHint=()=>{hint.textContent=!gotVm?'Väntar på operatören… (öppna från operatörsfönstret)':(document.fullscreenElement?'Dubbelklicka för att lämna helskärm':'Klicka för helskärm · dra fönstret till rätt skärm först');};
  const apply=msg=>{
    if(!msg||msg.type!=='vh:vm'||msg.ts<=lastTs) return;
    lastTs=msg.ts;gotVm=true;mirror=!!msg.vm.mirror;
    renderStage(stage,msg.vm);layout();updHint();
  };
  const up=msg=>{msg.id=uid();try{CH&&CH.postMessage(msg);}catch(e){}try{window.opener&&window.opener.postMessage(msg,'*');}catch(e){}};
  if(CH) CH.addEventListener('message',e=>apply(e.data));
  addEventListener('message',e=>apply(e.data));
  addEventListener('storage',e=>{if(e.key===LS_VM&&e.newValue){try{apply(JSON.parse(e.newValue));}catch(x){}}});
  try{apply(JSON.parse(localStorage.getItem(LS_VM)));}catch(e){}
  up({type:'vh:hello'});
  setInterval(()=>up({type:'vh:ping'}),2000);
  setInterval(()=>tickStage(stage),250);
  (function calLoop(){if(stage._v&&stage._v.calib) tickCal(stage,stage._v.fps);requestAnimationFrame(calLoop);})();
  addEventListener('resize',layout);layout();updHint();
  addEventListener('click',()=>{if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});});
  addEventListener('dblclick',()=>{if(document.fullscreenElement) document.exitFullscreen();});
  document.addEventListener('fullscreenchange',()=>{updHint();setTimeout(layout,50);});
  addEventListener('keydown',e=>{if(e.key==='F11'||e.metaKey||e.ctrlKey) return;e.preventDefault();up({type:'vh:key',key:e.key,shift:e.shiftKey,code:e.code});});
  // Göm muspekare + hint vid inaktivitet
  let idleT;const wake=()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),2500);};
  addEventListener('mousemove',wake);wake();
  // Håll skärmen vaken
  let lock=null;const reqLock=async()=>{try{if('wakeLock' in navigator&&document.visibilityState==='visible') lock=await navigator.wakeLock.request('screen');}catch(e){}};
  document.addEventListener('visibilitychange',reqLock);reqLock();
}

let data,live,settings,logs={},displayWin=null,lastPing=0,view='live',undoStack=[];
const seenIds=new Set();

function read(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}

function seedData(){const ep=clone(SEED);ep.id=uid();ep.sections.forEach(s=>{s.id=uid();s.cards.forEach(c=>c.id=uid());});return {episodes:[ep],activeEpisodeId:ep.id};}
function emptyEpisode(){return {id:uid(),title:'Ny episod',guest:'',guestTitle:'',sections:[{id:uid(),title:'BLOCK 1',cards:[newCard('core','')]}]};}

const activeEp=()=>data.episodes.find(e=>e.id===data.activeEpisodeId);
const allCards=(ep=activeEp())=>ep?ep.sections.flatMap(s=>s.cards):[];
const navCards=()=>allCards().filter(c=>!live.skipped[c.id]);
function findCard(id){if(!id) return null;for(const ep of data.episodes)for(const sec of ep.sections)for(const card of sec.cards) if(card.id===id) return {ep,sec,card};return null;}
function maxReveal(c){
  if(c.kind==='moment') return c.list.length;
  if(c.kind!=='script'&&c.followUp) return 1;
  return 0;
}
function cardSummary(c){
  if(c.kind==='script') return (c.text||'').split('\n')[0]||'(tomt manus)';
  if(c.kind==='moment') return (c.text||'Moment')+(c.list.length?` – ${c.list.length} st`:'');
  return (c.text||'').replace(/\n/g,' ')||'(tom)';
}

function load(){
  data=read(LS_DATA);
  if(!data||!Array.isArray(data.episodes)||!data.episodes.length) data=seedData();
  settings={...DEFAULT_SETTINGS,...(read(LS_SETTINGS)||{})};
  if(!/^#[0-9a-f]{6}$/i.test(settings.accent||'')) settings.accent=DEFAULT_SETTINGS.accent;
  if(!settings.publicUrl) settings.publicUrl=DEFAULT_SETTINGS.publicUrl;
  live={...clone(DEFAULT_LIVE),...(read(LS_LIVE)||{})};
  live.cue=null;live.calib=false;
  if(!live.rec) live.rec=clone(DEFAULT_LIVE.rec);
  logs=read(LS_LOG)||{};
  if(!activeEp()) data.activeEpisodeId=data.episodes[0].id;
  if(live.rec.on){ // webbläsaren stängdes under REC: fortsätt samma dag, annars avsluta klippet vid sista raden
    const L=epLog(),c=L.clips.find(c=>c.n===live.rec.clip),lastMs=L.entries.reduce((m,e)=>Math.max(m,e.ms),c?c.startMs:0);
    if(!c||Date.now()-lastMs>6*3600000){if(c&&!c.endMs){c.endMs=lastMs;c.endTc=tcWith(clipSync(c),lastMs);}live.rec=clone(DEFAULT_LIVE.rec);saveLog();}
  }
  ensurePos();
}
function ensurePos(){
  const f=findCard(live.cardId);

function viewModel(){

function onUp(e){

/* ---- navigation ---- */
function commit(){if(live.cardId) live.visited[live.cardId]=true;autoLog();saveLive();renderLive();broadcast();}
function go(id,r){live.cardId=id;live.reveal=r||0;commit();}
function steps(){const out=[];for(const c of navCards()) for(let r=0;r<=maxReveal(c);r++) out.push([c.id,r]);return out;}
function stepIndex(st){return st.findIndex(([id,r])=>id===live.cardId&&r===live.reveal);}
function neighbour(dir){
  const all=allCards(),ci=all.findIndex(c=>c.id===live.cardId);
  const list=dir>0?all.slice(ci+1):all.slice(0,Math.max(ci,0)).reverse();
  return list.find(c=>!live.skipped[c.id]);
}
function next(){
  const st=steps(),i=stepIndex(st);
  if(i<0){const n=neighbour(1);if(n) go(n.id,0);return;}
  if(i<st.length-1) go(...st[i+1]);
}
function prev(){
  const st=steps(),i=stepIndex(st);
  if(i<0){const p=neighbour(-1);if(p) go(p.id,maxReveal(p));return;}
  if(i>0) go(...st[i-1]);
}
function nextCard(){const n=neighbour(1);if(n) go(n.id,0);}
function prevCard(){if(live.reveal>0) return go(live.cardId,0);const p=neighbour(-1);if(p) go(p.id,0);}
function toggleFollow(){
  const f=findCard(live.cardId);if(!f) return;
  if(f.card.kind==='moment'){live.reveal=live.reveal>=f.card.list.length?0:f.card.list.length;return commit();}
  if(!f.card.followUp) return;
  live.reveal=live.reveal?0:1;commit();
}
function cardSize(d){
  const f=findCard(live.cardId);if(!f) return;
  const c=f.card;c.scale=d?Math.round(Math.min(1.5,Math.max(0.4,(c.scale||1)+d*0.1))*10)/10:1;
  saveData();commit();
}
function toggleBlackout(){live.blackout=!live.blackout;commit();}
function toggleInfo(){live.showInfo=!live.showInfo;commit();}
let cueT=null;
function sendCue(text){
  if(!text) return;
  live.cue={text,ts:Date.now(),ttl:+settings.cueSeconds||0};
  if(live.rec.on) addEntry({kind:'cue',text:'Till värden: '+text});
  commit();
  clearTimeout(cueT);if(live.cue.ttl) cueT=setTimeout(()=>{live.cue=null;commit();},live.cue.ttl*1000+50);
}
function clearCue(){clearTimeout(cueT);if(live.cue){live.cue=null;commit();}}
function toggleTimer(){
  const t=live.timer;
  if(t.running){t.acc+=Date.now()-t.startedAt;t.running=false;}else{t.startedAt=Date.now();t.running=true;}
  commit();
}
function resetTimer(){live.timer={running:false,startedAt:0,acc:0};commit();}

function handleKey(k,e={}){
  if(e.shiftKey&&/^Digit[1-9]$/.test(e.code||'')){logTag(+e.code.slice(5)-1);return true;}
  switch(k){
    case 'r':case 'R':toggleRec();break;
    case 'c':case 'C':{const n=$('#noteInput');if(n){setView('live');n.focus();}break;}
    case 'ArrowRight':case ' ':case 'PageDown':case 'Enter':next();break;
    case 'ArrowLeft':case 'PageUp':case 'Backspace':prev();break;
    case 'ArrowDown':nextCard();break;
    case 'ArrowUp':prevCard();break;
    case 'Home':{const n=navCards()[0];if(n) go(n.id,0);break;}
    case 'End':{const n=navCards().slice(-1)[0];if(n) go(n.id,0);break;}
    case 'b':case 'B':case '.':toggleBlackout();break;
    case 'f':case 'F':toggleFollow();break;
    case 'i':case 'I':toggleInfo();break;
    case 'n':case 'N':settings.showNext=!settings.showNext;saveSettings();commit();break;
    case 't':case 'T':toggleTimer();break;
    case 'Escape':case '0':clearCue();break;
    case '-':cardSize(-1);break;
    case '+':case '=':cardSize(1);break;
    default:
      if(/^[1-9]$/.test(k)) sendCue(settings.cues[+k-1]);
      else return false;
  }
  return true;
}

/* ---- tidskodssynk ---- */
// Textigenkänning (Tesseract) laddas från nätet första gången och cachas sedan av webbläsaren.
const OCR_SRC='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const OCR_LANG='https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0';
let camStream=null,snap=null,ocrWorker=null,ocrLoading=null,ocrRun=null,syncCtx=null;
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('nätverk'));document.head.appendChild(el);});}
function getOcr(status=()=>{}){
  if(ocrWorker) return Promise.resolve(ocrWorker);
  if(!ocrLoading) ocrLoading=(async()=>{
    status('Laddar textigenkänning … (kräver internet första gången)');
    if(!window.Tesseract) await loadScript(OCR_SRC);
    const w=await Tesseract.createWorker('eng',1,{langPath:OCR_LANG,logger:m=>{if(m.status==='loading language traineddata'&&m.progress<1) status(`Laddar textigenkänning … ${Math.round(m.progress*100)} %`);}});
    await w.setParameters({tessedit_char_whitelist:'0123456789:;.',tessedit_pageseg_mode:'7'});
    return ocrWorker=w;
  })().catch(e=>{ocrLoading=null;throw e;});
  return ocrLoading;
}
// Beskär till rutan runt tidskoden, förstora, gråskala och tröskla (Otsu) till svart text på vitt
function ocrCanvas(src,roi){
  const sw=src.videoWidth||src.width,sh=src.videoHeight||src.height,r=roi||{x:0,y:0,w:1,h:1};
  const sx=r.x*sw,sy=r.y*sh,w=Math.max(4,r.w*sw),h=Math.max(4,r.h*sh),k=Math.min(5,Math.max(1,110/h));
  const W=Math.round(w*k),H=Math.round(h*k),c=document.createElement('canvas');c.width=W+40;c.height=H+40;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,sx,sy,w,h,20,20,W,H);
  const d=x.getImageData(20,20,W,H),p=d.data,n=W*H,g=new Uint8Array(n),hist=new Array(256).fill(0);
  for(let i=0,j=0;j<n;i+=4,j++){const v=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000|0;g[j]=v;hist[v]++;}
  let sum=0;for(let i=0;i<256;i++) sum+=i*hist[i];
  let sB=0,wB=0,best=0,th=128;for(let i=0;i<256;i++){wB+=hist[i];if(!wB) continue;const wF=n-wB;if(!wF) break;sB+=i*hist[i];const mB=sB/wB,mF=(sum-sB)/wF,b=wB*wF*(mB-mF)*(mB-mF);if(b>best){best=b;th=i;}}
  let above=0;for(let j=0;j<n;j++) if(g[j]>th) above++;
  const lightText=above<n/2;
  for(let i=0,j=0;j<n;i+=4,j++){const ink=lightText?g[j]>th:g[j]<=th,v=ink?0:255;p[i]=p[i+1]=p[i+2]=v;p[i+3]=255;}
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.putImageData(d,20,20);
  return c;
}
function parseOcrTC(text,nom){
  const t=String(text||'');
  // Först: fyra grupper med avskiljare (säkrast), sedan sammanskrivna siffror
  for(const m of t.matchAll(/(\d{2})\s*[:;.,]\s*(\d{2})\s*[:;.,]\s*(\d{2})\s*[:;.,]\s*(\d{2})/g)){const v=parseTC(m.slice(1,5).join(':'),nom);if(v!==null) return v;}
  const c=t.replace(/\s+/g,'').match(/(\d{2})[:;.,]?(\d{2})[:;.,]?(\d{2})[:;.,]?(\d{2})/);
  return c?parseTC(c.slice(1).join(':'),nom):null;
}
async function readTC(video,nom,roi){
  const tRaw=Date.now(),c=ocrCanvas(video,roi),w=await getOcr();
  const {data}=await w.recognize(c);
  return {tRaw,tc:parseOcrTC(data.text,nom),text:(data.text||'').trim()};
}
// Läser tills `need` avläsningar stämmer med varandra: tidskoden måste öka exakt i takt med klockan.
// Felavläsningar bryter mönstret och sorteras bort. Medianen ger ±1 ruta.
async function collectTC(video,fps,need,o={}){
  const [nom,real]=FPS[fps],reads=[],start=Date.now(),run=o.run||{},status=o.status||(()=>{});
  const roi=o.roi!==undefined?o.roi:settings.ocrRoi,lat=o.calib?0:(+settings.camLatency||0);
  while(!run.stop&&Date.now()-start<(o.timeout||20000)){
    if(!video.videoWidth){await sleep(200);continue;}
    let r;try{r=await readTC(video,nom,roi);}catch(e){throw e;}
    if(run.stop) return null;
    if(r.tc===null){status(`Ser ingen tidskod ännu (läste ”${r.text.slice(0,24)||'–'}”). Dra en ruta tätt runt tidskoden.`);continue;}
    const t=r.tRaw-lat;reads.push({t,tc:r.tc,off:r.tc-t/1000*real});
    const grp=reads.map(a=>reads.filter(b=>Math.abs(b.off-a.off)<=2)).sort((x,y)=>y.length-x.length)[0];
    status(`Läste ${framesToTC(r.tc,nom)} · ${grp.length} av ${need} avläsningar stämmer`);
    if(grp.length>=need){const os=grp.map(b=>b.off).sort((a,b)=>a-b);return {off:os[os.length>>1],n:os.length,spread:os[os.length-1]-os[0],nom,real,fps};}
  }
  return null;
}
function applySyncFrames(t,F,fps,method,quiet){
  if(MODE==='phone') return phoneSendResult(t,F,fps,method);
  const day=FPS[fps][0]*86400,first=!settings.tcSync;settings.fps=fps;
  if(first&&settings.tcMode==='timer') settings.tcMode='camera';
  setSync({t0:t,baseFrames:((F%day)+day)%day,fps,method,at:Date.now()});
  if(!quiet) toast('Tidskoden är synkad'+(first?' – värdskärmen visar nu kamerans tidskod':''));
}
// Räknar om tidskoderna för ett klipp (rader loggade innan synken blev klar)
function retimeClip(n){
  const L=epLog(),c=L.clips.find(c=>c.n===n);if(!c) return;
  const sy=clipSync(c);
  c.startTc=tcWith(sy,c.startMs);if(c.endMs) c.endTc=tcWith(sy,c.endMs);
  L.entries.forEach(e=>{if(e.clip===n&&e.rec) e.tc=tcWith(sy,e.ms);});saveLog();
}
// Stäng automatiskt när synken startades av REC
function syncDone(){
  if(!syncCtx||!syncCtx.auto) return;
  setTimeout(()=>{if(syncCtx&&syncCtx.auto&&!$('#modal').hidden&&$('#syAutoBtn')) closeModal();},1400);
}
function applySync(t0,tcStr,method){
  const fps=$('#syFps').value,nom=FPS[fps][0],now=Date.now();

  const J={episode:ep.title,guest:ep.guest,guestTitle:ep.guestTitle,fps:sy?sy.fps:S.fps,synced:!!sy,
    clips:L.clips.map(c=>({clip:'K'+c.n,startTc:c.startTc,endTc:c.endTc})),
    script:ep.sections.map(s=>({section:s.title,cards:s.cards.map(c=>({f:fid(c.id),kind:c.kind,text:cardSummary(c),followUp:c.followUp||undefined,options:c.kind==='moment'&&c.list.length?c.list:undefined}))})),
    log:E.map(e=>({tc:e.tc,rel:rel(e),f:e.cardId?fid(e.cardId):undefined,kind:e.kind,tag:e.tag||undefined,text:(e.kind==='tag'?e.note:e.text)||undefined,flag:near[e.id]||undefined})),
    notes:(L.notes||'').trim()||undefined};
  out.push('','## Data (JSON)','','```json',JSON.stringify(J),'```');
  return out.join('\n');
}
function buildCsv(){
  const safe=v=>{v=String(v??'');return /^[=+\-@\t\r]/.test(v)?"'"+v:v;};   // hindra att kalkylprogram tolkar text som formel
  const q=v=>'"'+safe(v).replace(/"/g,'""')+'"';
  const L=epLog(),num={},start={};let n=0;activeEp().sections.forEach(s=>s.cards.forEach(c=>num[c.id]='F'+(++n)));L.clips.forEach(c=>start[c.n]=c.startMs);
  const rows=[['Tidskod','Klipp','Tid in i klippet','REC','Fråga','Typ','Tagg','Kommentar','Sektion','Kort']];
  L.entries.slice().sort((a,b)=>a.ms-b.ms).forEach(e=>rows.push([e.tc,e.rec?'K'+e.clip:'',e.rec&&start[e.clip]?fmtDur(e.ms-start[e.clip]):'',e.rec?'ja':'nej',num[e.cardId]||'',
    {card:'på skärm',reveal:'visat',rec:'rec start',stop:'rec stopp',cue:'till värden',tag:'tagg',note:'kommentar'}[e.kind]||e.kind,e.tag,e.kind==='tag'?e.note:e.text,e.section,e.card]));
  return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}

const HELPER=(()=>{try{return localStorage.getItem('vh.helper')||'';}catch(e){return '';}})()||'http://127.0.0.1:47811';

// Startar menyradsappen via dess länkschema och väntar tills den svarar

async function ttRender(){

  let st;try{st=await tt('/status');ttUp=true;}catch(e){ttUp=false;}

  if(!ttUp){box.innerHTML=`<h4>Transkript <span class="muted">· av</span></h4>${have}<div class="row"><button data-a="ex-tt-start">▶ Starta Logsync-appen</button><span id="ttMsg" class="muted">Startar menyradsappen på den här datorn. Första gången: <a href="${helperZip()}" style="color:inherit">hämta Logsync.app</a>, lägg den i Program och öppna den en gång därifrån.</span></div>`;return;}

function ttPoll(){
  clearTimeout(ttTimer);
  tt('/job').then(j=>{
    const bar=$('#ttBar'),msg=$('#ttMsg');
    if(bar) bar.style.width=(j.pct||0)+'%';
    if(msg) msg.textContent=j.state==='running'?`${j.msg||''} · ${Math.round(j.pct||0)} % · ${fmtDur((j.elapsed||0)*1000)}`:j.state==='error'?'⚠ '+j.msg:j.state==='cancelled'?'Transkriberingen avbröts.':'';
    if(j.state==='running'){ttTimer=setTimeout(ttPoll,1000);return;}
    if(j.state==='cancelled'||j.state==='error'){if(document.querySelector('[data-a=ex-tt-cancel]')) ttRender().then(()=>{const m=$('#ttMsg');if(m) m.textContent=j.state==='cancelled'?'Transkriberingen avbröts.':'⚠ '+j.msg;});return;}
    if(j.state==='done'&&j.result){
      const L=epLog(),r=j.result;
      if(!L.transcript||L.transcript.id!==j.id){
        L.transcript={id:j.id,fps:r.fps,language:r.language,speakers:r.speakers,sources:r.sources,files:r.files_written,
          turns:r.turns.map(t=>({tc:t.tc,out_tc:t.out_tc,speaker:t.speaker,text:t.text}))};
        if(!saveLog()) toast('⚠ Transkriptet är för stort för att sparas i webbläsaren – exportera direkt');
        toast('Transkriptet är klart och inläst');ttRender();exUpd();
      }
    }
  }).catch(()=>{ttTimer=setTimeout(ttPoll,3000);});
}
async function ttAction(a){
  try{
    if(a==='ex-tt-retry'){ttRender();return true;}
    if(a==='ex-tt-start'){if(await startHelper($('#ttMsg'))) ttRender();return true;}
    if(a==='ex-tt-cancel'){if(!confirm('Avbryta transkriberingen?')) return true;const m=$('#ttMsg');if(m) m.textContent='Avbryter …';await tt('/cancel',{});return true;}
    if(a==='ex-tt-stop'){await tt('/quit',{});ttUp=false;setTimeout(ttRender,800);return true;}
    if(a==='ex-tt-clear'){if(confirm('Ta bort transkriptet från loggen? (Filerna bredvid kamerafilen finns kvar.)')){delete epLog().transcript;saveLog();ttRender();exUpd();}return true;}
    if(a==='ex-tt-pick'){const m=$('#ttFiles');if(m) m.textContent='Fildialogen är öppen på datorn …';const j=await tt('/pick',{});ttFiles=j.files||[];ttRender();return true;}
    if(a==='ex-tt-run'){
      settings.ttHost=$('#ttN1').value.trim()||settings.hostName||'Värd';settings.ttLang=$('#ttLang').value;saveSettings();
      await tt('/transcribe',{paths:ttFiles.map(f=>f.path),names:{1:settings.ttHost,2:$('#ttN2').value.trim()||'Gäst'},lang:settings.ttLang,base:$('#ttN2').value.trim()||'transkript'});
      ttRender();return true;}
  }catch(e){toast('⚠ '+e.message);}
  return true;
}

function renderRundown(){
  const ep=activeEp();if(!ep){$('#rundown').innerHTML='';return;}
  let h=`<div class="rd-head"><div class="rd-title">${esc(ep.title||'Namnlös')}</div><div class="rd-guest">${esc(ep.guest)}${ep.guestTitle?' · '+esc(ep.guestTitle):''}</div></div>`;
  for(const s of ep.sections){
    h+=`<div class="rd-sec">${esc(s.title)}</div>`;
    for(const c of s.cards){
      const cls=['rd-card','k-'+c.kind];
      if(c.id===live.cardId) cls.push('cur');if(live.visited[c.id]) cls.push('done');if(live.skipped[c.id]) cls.push('skip');
      const flags=(c.recurring?'↻ ':'')+(c.followUp&&c.kind!=='script'?'⤷':'');
      h+=`<div class="${cls.join(' ')}" data-a="jump" data-id="${c.id}"><span class="rd-k">${hm(c.kind)}</span><span class="rd-t">${esc(cardSummary(c))}</span><span class="rd-f">${flags}</span><button class="rd-skip" data-a="skip" data-id="${c.id}" title="${live.skipped[c.id]?'Ta tillbaka':'Hoppa över'}">${live.skipped[c.id]?'↺':'⊘'}</button></div>`;
    }
  }
  h+=`<div class="rd-foot"><button data-a="reset-session">Nollställ bockar och överhoppade</button></div>`;
  const rd=$('#rundown');rd.innerHTML=h;
  const cur=rd.querySelector('.cur');if(cur) cur.scrollIntoView({block:'nearest'});
}
function scalePreview(){const w=$('#pvWrap').clientWidth;$('#pvStage').style.transform=`scale(${w/1920})`;}
function renderPreview(){
  const v=viewModel();renderStage($('#pvStage'),v);scalePreview();
  const b=[];if(live.blackout) b.push('STANDBY');if(settings.mirror) b.push('SPEGLAD');
  $('#pvBadges').innerHTML=b.map(x=>`<span>${x}</span>`).join('');
}
function renderSide(){
  $('#lgTags').innerHTML=settings.logTags.slice(0,9).map((t,i)=>`<button data-a="log-tag" data-i="${i}" title="Shift+${i+1}">${esc(t)}<kbd>⇧${i+1}</kbd></button>`).join('');
  renderRecState();renderLogMeta();
  $('#cues').innerHTML=settings.cues.slice(0,9).map((c,i)=>`<button data-a="cue" data-i="${i}" title="${esc(c)}">${esc(c)}<kbd>${i+1}</kbd></button>`).join('');
  $('#cueActive').textContent=cueVisible({cue:live.cue})?'Visas nu: '+live.cue.text:'';
  const f=findCard(live.cardId);
  const np=$('#nowPanel');
  if(!f){np.innerHTML='<h4>Aktuellt kort</h4><div class="muted">Inget kort.</div>';}
  else{
    const c=f.card;let h=`<h4>Aktuellt kort · bara för dig</h4><div class="now-sec"><span class="kbadge">${hm(c.kind)}${KINDS[c.kind]}</span>${esc(f.sec.title)}</div>`;
    if(c.kind==='moment'){
      if(c.rules) h+=`<div class="now-bg">${esc(c.rules)}</div>`;
      h+=`<ol class="now-list">${c.list.map((x,i)=>`<li class="${i<live.reveal?'rev':''}">${esc(x)}</li>`).join('')}</ol><div class="hint">→ visar nästa alternativ. F visar/döljer alla.</div>`;
    }
    if(c.followUp&&c.kind!=='script') h+=`<div class="muted" style="margin-top:6px">Följdfråga ${live.reveal>=1?'<b style="color:var(--acc)">visas stort</b>':(settings.previewFollowUp?'(syns litet – → gör den stor)':'(kommer på nästa →)')}</div><div>${esc(c.followUp)}</div>`;
    if(c.background) h+=`<div class="now-bg">${esc(c.background)}</div><button data-a="info" class="${live.showInfo?'on':''}" style="width:100%">${live.showInfo?'Dölj bakgrund för värden':'Visa bakgrund för värden'}<kbd>I</kbd></button>`;
    else if(c.kind!=='moment'&&!c.followUp) h+=`<div class="muted">Ingen bakgrund eller följdfråga.</div>`;
    np.innerHTML=h;
    const n=neighbour(1);
    np.insertAdjacentHTML('beforeend',n?`<h4 style="margin-top:14px">Nästa kort</h4><div class="nb-t"><span class="kbadge">${hm(n.kind)}${KINDS[n.kind]}</span>${esc(cardSummary(n))}</div>`:'<h4 style="margin-top:14px">Nästa kort</h4><div class="muted">Slut på episoden.</div>');
    // snabbredigering
    const qt=$('#qeText'),qf=$('#qeFollow');
    if(document.activeElement!==qt) qt.value=c.text;
    if(document.activeElement!==qf) qf.value=c.followUp;
    qt.placeholder=c.kind==='moment'?'Momentets titel':c.kind==='script'?'Manus (Namn: replik per rad)':'Fråga';
    qf.hidden=c.kind==='moment'||c.kind==='script';
  }
}
function quickEdit(field,val){
  const f=findCard(live.cardId);if(!f) return;
  f.card[field]=val;ensurePos();saveData();broadcastSoon();
  clearTimeout(quickEdit.t);quickEdit.t=setTimeout(()=>{renderRundown();renderSide();},300);
}

function switchEpisode(id){
  stopRec('REC stoppad vid byte av episod');
  data.activeEpisodeId=id;saveData(true);live.cardId=null;live.reveal=0;ensurePos();
  renderAll();broadcast();saveLive();
}
function setView(v){
  view=v;$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  $('#live').hidden=v!=='live';$('#edit').hidden=v!=='edit';
  if(v==='edit') renderEditor();else{ensurePos();renderLive();scalePreview();}
}

function onClick(e){
  const tab=e.target.closest('[data-view]');if(tab) return setView(tab.dataset.view);
  const sy=e.target.closest('[data-sy]');if(sy){showPane(sy.dataset.sy);return;}
  const el=e.target.closest('[data-a]');if(!el) return;
  const a=el.dataset.a,id=el.dataset.id;
  switch(a){
    case 'next':next();break;case 'prev':prev();break;
    case 'follow':toggleFollow();break;case 'info':toggleInfo();break;case 'blackout':toggleBlackout();break;
    case 'jump':go(id,0);break;
    case 'skip':e.stopPropagation();live.skipped[id]=!live.skipped[id];if(!live.skipped[id]) delete live.skipped[id];saveLive();renderLive();broadcast();break;
    case 'reset-session':if(confirm('Nollställa bockar och överhoppade kort?')){live.visited={};live.skipped={};ensurePos();commit();}break;
    case 'cue':sendCue(settings.cues[+el.dataset.i]);break;
    case 'sz-down':cardSize(-1);break;case 'sz-up':cardSize(1);break;case 'sz-reset':cardSize(0);break;
    case 'cue-clear':clearCue();break;
    case 'timer':toggleTimer();break;
    case 'timer-reset':resetTimer();break;
    case 'open-display':openDisplay();break;
    case 'settings':openSettings();break;
    case 'rec':toggleRec();break;
    case 'log-tag':logTag(+el.dataset.i);break;
    case 'log-del':{const L=epLog();L.entries=L.entries.filter(x=>x.id!==id);saveLog();renderLog();break;}
    case 'tc-sync':openSync();break;
    case 'log-export':openExport();break;
    case 'modal-close':closeModal();break;
    case 'undo':undo();break;
    default:if(!syncAction(a,el)&&!phoneAction(a)&&!exportAction(a)&&!brandAction(a,el)) editorAction(a,el,e);
  }
}

/* ---- toast & undo ---- */
let toastT;
function toast(msg,ms=3500,undoable){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undoable?'<button data-a="undo">Ångra</button>':''}`;
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms);
}
function snapshot(){undoStack.push(clone(data));if(undoStack.length>40) undoStack.shift();}
function undo(){const d=undoStack.pop();if(!d) return;data=d;saveData(true);ensurePos();renderAll();broadcast();$('#toast').classList.remove('show');}

  const side=`<aside class="ed-side">

      ${data.episodes.map(e=>`<div class="ed-ep ${e.id===data.activeEpisodeId?'on':''}" data-a="ep-pick" data-id="${e.id}">${esc(e.guest||'Utan gäst')}<small>${esc(e.title||'Namnlös')} · ${allCards(e).length} kort</small></div>`).join('')}
      <button data-a="ep-new">＋ Ny tom episod</button>

  if(!ep){main+='<p class="muted">Ingen episod.</p>';}
  else{
    main+=`<div class="ed-meta">
      <label>Episodtitel<input data-ef="title" value="${esc(ep.title)}"></label>
      <label>Gäst<input data-ef="guest" value="${esc(ep.guest)}"></label>
      <label>Gästens titel<input data-ef="guestTitle" value="${esc(ep.guestTitle)}"></label></div>`;
    ep.sections.forEach((s,si)=>{
      main+=`<div class="ed-sec" data-sec="${s.id}">
        <div class="ed-sec-h"><input data-sf="title" value="${esc(s.title)}" placeholder="Sektionsnamn, t.ex. BLOCK 1">
          <button class="ghost" data-a="sec-up" data-id="${s.id}" title="Flytta upp" ${si===0?'disabled':''}>↑</button>
          <button class="ghost" data-a="sec-down" data-id="${s.id}" title="Flytta ner" ${si===ep.sections.length-1?'disabled':''}>↓</button>
          <button class="ghost danger" data-a="sec-del" data-id="${s.id}" title="Ta bort sektion">✕</button></div>
        <div class="ed-cards">
          ${s.cards.map(c=>cardEditor(c)).join('')||'<div class="ed-empty">Inga kort ännu.</div>'}
          <div class="ed-add">${Object.entries(KINDS).map(([k,l])=>`<button data-a="card-add" data-id="${s.id}" data-kind="${k}">＋ ${l}</button>`).join('')}</div>
        </div></div>`;
    });
    main+=`<button data-a="sec-add">＋ Ny sektion</button>`;
  }
  main+='</div></main>';
  const ed=$('#edit');
  const scroll=ed.querySelector('.ed-main')?.scrollTop||0;
  ed.innerHTML=side+main;
  ed.querySelector('.ed-main').scrollTop=scroll;
  if(!ed._bound){ed._bound=true;ed.addEventListener('input',onEditorInput);ed.addEventListener('change',onEditorChange);}
